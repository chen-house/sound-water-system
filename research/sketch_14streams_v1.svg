<svg viewBox="0 0 980 710" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Noto Serif SC', serif">
  <title>1976—2026 十四条 jazz 支流关系草图</title>
  <desc>横轴为时间 1976 到 2026,十四条支流按出生年起跑、全部流到 2026;虚线标出七个互相渗透的交叉点;菱形标出 Gilles Peterson 出现的位置。</desc>
  <rect width="980" height="710" fill="#f5f1e8"/>

  <text x="200" y="28" font-size="15" fill="#2b2b2b" font-weight="600">1976—2026 · 十四条平行水文(工作草图)</text>
  <text x="200" y="46" font-size="11" fill="#7a7365">起点 = 大约出生年 · 没有一条断流,全部流到 2026</text>

  <line x1="200" y1="62" x2="950" y2="62" stroke="#b8b0a0" stroke-width="1"/>
  <g font-size="10" fill="#7a7365" text-anchor="middle">
    <text x="200" y="56">1976</text><text x="350" y="56">1986</text><text x="500" y="56">1996</text>
    <text x="650" y="56">2006</text><text x="800" y="56">2016</text><text x="950" y="56">2026</text>
  </g>
  <g stroke="#dcd5c6" stroke-width="1">
    <line x1="350" y1="62" x2="350" y2="656"/>
    <line x1="500" y1="62" x2="500" y2="656"/>
    <line x1="650" y1="62" x2="650" y2="656"/>
    <line x1="800" y1="62" x2="800" y2="656"/>
  </g>

  <g font-size="10" fill="#7a7365" font-weight="600" letter-spacing="1">
    <text x="14" y="80">电流一侧</text>
    <text x="14" y="212">原声一侧</text>
    <text x="14" y="380">舞池一侧</text>
    <text x="14" y="584">自成一格</text>
  </g>

  <g stroke="#57503f" stroke-width="2" opacity="0.85">
    <line x1="200" y1="96"  x2="950" y2="96"/>
    <line x1="230" y1="130" x2="950" y2="130"/>
    <line x1="425" y1="164" x2="950" y2="164"/>
    <line x1="260" y1="228" x2="950" y2="228"/>
    <line x1="335" y1="262" x2="950" y2="262"/>
    <line x1="200" y1="296" x2="950" y2="296"/>
    <line x1="200" y1="330" x2="950" y2="330"/>
    <line x1="365" y1="396" x2="950" y2="396"/>
    <line x1="410" y1="430" x2="950" y2="430"/>
    <line x1="425" y1="464" x2="950" y2="464"/>
    <line x1="515" y1="498" x2="950" y2="498"/>
    <line x1="770" y1="532" x2="950" y2="532"/>
    <line x1="200" y1="600" x2="950" y2="600"/>
    <line x1="785" y1="634" x2="950" y2="634"/>
  </g>
  <g fill="#2b2b2b">
    <circle cx="200" cy="96" r="3.5"/><circle cx="230" cy="130" r="3.5"/><circle cx="425" cy="164" r="3.5"/>
    <circle cx="260" cy="228" r="3.5"/><circle cx="335" cy="262" r="3.5"/><circle cx="200" cy="296" r="3.5"/>
    <circle cx="200" cy="330" r="3.5"/><circle cx="365" cy="396" r="3.5"/><circle cx="410" cy="430" r="3.5"/>
    <circle cx="425" cy="464" r="3.5"/><circle cx="515" cy="498" r="3.5"/><circle cx="770" cy="532" r="3.5"/>
    <circle cx="200" cy="600" r="3.5"/><circle cx="785" cy="634" r="3.5"/>
  </g>

  <g font-size="12" fill="#2b2b2b" text-anchor="end">
    <text x="192" y="100">Fusion 余波</text>
    <text x="222" y="134">Smooth</text>
    <text x="417" y="168">Jam / jazz-funk</text>
    <text x="252" y="232">Neo-trad</text>
    <text x="327" y="266">M-Base / downtown</text>
    <text x="192" y="300">ECM / 北欧</text>
    <text x="192" y="334">拉丁 jazz</text>
    <text x="357" y="400">Acid jazz</text>
    <text x="402" y="434">House jazz</text>
    <text x="417" y="468">Hip-hop 融合</text>
    <text x="507" y="502">Nu jazz</text>
    <text x="762" y="536">UK 浪潮</text>
    <text x="192" y="604">日本一脉</text>
    <text x="777" y="638">Spiritual 复兴</text>
  </g>

  <g stroke="#c96442" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.9">
    <line x1="305" y1="96"  x2="305" y2="464"/>
    <line x1="425" y1="96"  x2="425" y2="164"/>
    <line x1="505" y1="330" x2="505" y2="430"/>
    <line x1="525" y1="296" x2="525" y2="498"/>
    <line x1="620" y1="464" x2="620" y2="600"/>
    <line x1="740" y1="464" x2="740" y2="634"/>
    <line x1="815" y1="532" x2="815" y2="634"/>
  </g>
  <!-- 灌水双方端点(虚线只连两端,中间泳道仅被穿过) -->
  <g fill="#c96442">
    <circle cx="305" cy="96" r="4.5"/><circle cx="305" cy="464" r="4.5"/>
    <circle cx="425" cy="96" r="4.5"/><circle cx="425" cy="164" r="4.5"/>
    <circle cx="505" cy="330" r="4.5"/><circle cx="505" cy="430" r="4.5"/>
    <circle cx="525" cy="296" r="4.5"/><circle cx="525" cy="498" r="4.5"/>
    <circle cx="620" cy="464" r="4.5"/><circle cx="620" cy="600" r="4.5"/>
    <circle cx="740" cy="464" r="4.5"/><circle cx="740" cy="634" r="4.5"/>
    <circle cx="815" cy="532" r="4.5"/><circle cx="815" cy="634" r="4.5"/>
  </g>
  <g font-size="10" fill="#c96442" font-weight="600">
    <circle cx="305" cy="280" r="9" fill="#f5f1e8" stroke="#c96442"/><text x="305" y="284" text-anchor="middle">1</text>
    <circle cx="437" cy="130" r="9" fill="none" stroke="#c96442"/><text x="437" y="134" text-anchor="middle">2</text>
    <circle cx="493" cy="380" r="9" fill="none" stroke="#c96442"/><text x="493" y="384" text-anchor="middle">3</text>
    <circle cx="537" cy="360" r="9" fill="none" stroke="#c96442"/><text x="537" y="364" text-anchor="middle">4</text>
    <circle cx="632" cy="532" r="9" fill="none" stroke="#c96442"/><text x="632" y="536" text-anchor="middle">5</text>
    <circle cx="752" cy="550" r="9" fill="none" stroke="#c96442"/><text x="752" y="554" text-anchor="middle">6</text>
    <circle cx="827" cy="580" r="9" fill="none" stroke="#c96442"/><text x="827" y="584" text-anchor="middle">7</text>
  </g>

  <g fill="#c96442">
    <rect x="361" y="392" width="8" height="8" transform="rotate(45 365 396)"/>
    <rect x="501" y="426" width="8" height="8" transform="rotate(45 505 430)"/>
    <rect x="556" y="494" width="8" height="8" transform="rotate(45 560 498)"/>
    <rect x="786" y="528" width="8" height="8" transform="rotate(45 790 532)"/>
  </g>

  <g font-size="11" fill="#7a7365">
    <line x1="200" y1="684" x2="240" y2="684" stroke="#57503f" stroke-width="2"/>
    <text x="248" y="688">支流(起点=出生年)</text>
    <circle cx="404" cy="684" r="4.5" fill="#c96442"/>
    <line x1="404" y1="684" x2="440" y2="684" stroke="#c96442" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="440" cy="684" r="4.5" fill="#c96442"/>
    <text x="452" y="688">互相灌水(只连两个圆点端,中间泳道仅被穿过)</text>
    <rect x="620" y="680" width="8" height="8" transform="rotate(45 624 684)" fill="#c96442"/>
    <text x="636" y="688">Gilles Peterson 出现的地方</text>
  </g>

  <!-- 交叉点编号对照:
    1 = 1983〈Rockit〉Herbie 玩搓碟,Fusion 提前接上 Hip-hop
    2 = 1991 Fusion 野生化分叉出 Jam/jazz-funk(MMW 成军)
    3 = 1997 Nuyorican Soul:拉丁 × House(出在 Talkin' Loud)
    4 = 1997 Molvær《Khmer》:ECM 灌进 Nu jazz
    5 = 2004 Nujabes《Samurai Champloo》:Hip-hop × 日本 → 全球 lofi
    6 = 2015《To Pimp a Butterfly》/ Brainfeeder:Hip-hop × Spiritual
    7 = Shabaka 一个人:UK 浪潮 × Spiritual
    ◆ = Gilles Peterson:Acid(88) → Talkin' Loud(97) → nu jazz(00s) → We Out Here(2018)
  -->
</svg>
