<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>

  #embedcol { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }

  #trackline { font-size: 9.5px; color: #93908a; line-height: 1.7; text-align: right; }

  .zone { display: flex; flex-direction: column; padding: 7px 9px 5px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.30); border-radius: 12px; }
  .zone-label { font-size: 9px; color: var(--dim); letter-spacing: .14em; margin: 0 0 8px 1px; white-space: nowrap; }
  .zone-row { display: flex; gap: 7px; justify-content: center; align-items: flex-end; flex: 1; }
  .strip { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.42); border-radius: 10px;
    padding: 7px 5px 9px; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55); transition: box-shadow .35s, border-color .35s, background .35s; }
  .strip:hover { background: rgba(255,255,255,.24); }
  .strip.active { border-color: var(--accent); background: rgba(255,255,255,.26);
    box-shadow: 0 0 0 1px var(--accent), 0 0 20px -3px var(--accent), inset 0 1px 0 rgba(255,255,255,.6); }
  .tag { font-size: 8.5px; padding: 3px 3px; border-radius: 4px; color: #fff; width: 100%; text-align: center;

  .fadwrap { display: flex; gap: 4px; align-items: center; }

  #vinyl { width: 130px; height: 130px; border-radius: 50%; display: none;

/* type: trigger | spectrum。spectrum.points 从低位(端A)到高位(端B) */
const CHANNELS = [

    paras:["前面那些流,有的插电、有的采样、有的进俱乐部。最后这条,什么都没加——一群人,原声乐器,坐下来写,坐下来即兴。",
      "但它不是回头复刻正典(那是另一种活人)。这一代最敢探的声音之一 Ambrose Akinmusire,把克制的不协和缓缓吹出、包在优美主题里,留白、旋律先行、和声有耐心。",

    track:{ label:"Weather Report —〈Birdland〉· 1977", id:"19vVghIuHm3IAfN4xpRF3q" },

      "1991 年前后,The Brand New Heavies 这样的活乐队把它顶进主流:funk 底、soul 嗓、jazz 即兴,台上全是活人。","这条流不考你耳朵,它让你站起来。"] },
  { ch:"CH 8", tag:"UK WAVE", zone:1, color:"#2E9C8E", size:"L", type:"trigger",
    track:{ label:"Ezra Collective —〈Victory Dance〉· 2022", id:"6GumLQysBiahvtJmxMXOpn" },
    paras:["最年轻的一条,现在进行时。","伦敦青训营 Tomorrow's Warriors 教移民街区的孩子玩爵士。这批孩子把 grime、afrobeat、dub 全焊进爵士,俱乐部里人群跟着萨克斯蹦。",
      "2023 年 Mercury 奖,爵士乐队 Ezra Collective 头一回拿奖。鼓手上台第一句:先感谢上帝。","这支乐队,就从那个青训营里长出来。"] },
  // ===== 电子区 =====
  { ch:"CH 4", tag:"HIP-HOP", zone:2, color:"#7ea87e", size:"XL", type:"spectrum",

    points:[
      { postag:"采样端 · A Tribe Called Quest", label:"A Tribe Called Quest —〈Excursions〉· 1991", id:"4tEaytMs86hIaOSsiGoLcP" },
      { postag:"过渡 · Us3(采样×acid)", label:"Us3 —〈Cantaloop (Flip Fantasia)〉· 1993", id:"2AnTuxahfcAS7dGxGZnihY" },

  "7-9": { type:"pad", cap:"Us3〈Cantaloop〉· 1993", sub:"一脚 acid jazz、一脚 hip-hop——Blue Note 头一回授权自家唱片被整张采样" },

  "1-9": { type:"pad", cap:"洛杉矶 · Brainfeeder", sub:"Kamasi 的萨克斯吹在《To Pimp a Butterfly》里;《The Epic》出在 Flying Lotus 的厂牌上" },
  "1-8": { type:"scratch", cap:"Shabaka Hutchings", sub:"浪尖上的人,2024 年放下萨克斯,拿起了笛子" },
  "7-8": { type:"scratch", cap:"Gilles Peterson", sub:"80 年代末办 Acid Jazz 厂牌的人,2018 年给伦敦新浪潮升旗:《We Out Here》" },
  "0-10": { type:"scratch", cap:"Nils Petter Molvær《Khmer》· 1997", sub:"一把电子化的小号,从 ECM 漂进了氛围" },

const relOf = (a,b) => REL[`${Math.min(a,b)}-${Math.max(a,b)}`] || null;
const ZONES = ["原声 · 活人", "电声 · 插电乐队", "电子 · 采样/编程"];
const THRESHOLD = -30, PARK = -48;

/* Spotify iframe API */
let spCtrl=null, spReady=false, pendingId=null;
window.onSpotifyIframeApiReady = (API) => {
  const box=document.getElementById("embed"); box.innerHTML=""; box.classList.add("live");
  const h=document.createElement("div"); box.appendChild(h);
  API.createController(h, { uri:`spotify:track:${CHANNELS[9].points[0].id}`, width:"100%", height:80 },
    (c)=>{ spCtrl=c; spReady=true; if(pendingId){loadAndPlay(pendingId);pendingId=null;} });
};
function loadAndPlay(id){ if(!spReady){pendingId=id;return;} spCtrl.loadUri(`spotify:track:${id}`); setTimeout(()=>spCtrl.play(),350); }
function pauseTrack(){ if(spReady)spCtrl.pause(); }

/* 过渡音效 */
const scrGain=new Tone.Gain(0).toDestination(); const scrFilter=new Tone.Filter(800,"bandpass"); scrFilter.Q.value=6;
const scrNoise=new Tone.Noise("pink"); scrNoise.connect(scrFilter); scrFilter.connect(scrGain);
function playScratch(){scrNoise.start();const now=Tone.now(),f=scrFilter.frequency,g=scrGain.gain;
  [[0,.12,400,2600],[.14,.1,2600,500],[.28,.12,500,3000],[.44,.16,3000,300],[.66,.1,300,2200],[.8,.14,2200,600]]
  .forEach(([t,d,a,b])=>{f.setValueAtTime(a,now+t);f.rampTo(b,d,now+t);g.setValueAtTime(.5,now+t);g.rampTo(.05,d,now+t);});
  g.rampTo(0,.2,now+1.0);setTimeout(()=>scrNoise.stop(),1400);}
const padSynth=new Tone.PolySynth(Tone.Synth,{oscillator:{type:"sawtooth"},volume:-8,envelope:{attack:.003,decay:.2,sustain:0,release:.15}}).toDestination();
const padThump=new Tone.MembraneSynth({volume:-4,pitchDecay:.03}).toDestination();
function playPads(color){[["C3","G3"],["D3","A3"],["F3","C4"],["G3","D4"]].forEach((c,i)=>{
  setTimeout(()=>{padThump.triggerAttackRelease("C1","16n");padSynth.triggerAttackRelease(c,"16n");
    const p=document.getElementById("p"+i);p.style.setProperty("--flash",color);
    p.classList.remove("hit");void p.offsetWidth;p.classList.add("hit");},i*160);});}

/* 界面 */
const desk=document.getElementById("glass");
const dot=document.getElementById("dot"), segtxt=document.getElementById("segtxt"), segmeta=document.getElementById("segmeta"),
      specpos=document.getElementById("specpos"), segblurb=document.getElementById("segblurb"),
      embed=document.getElementById("embed"), trackline=document.getElementById("trackline");
const overlay=document.getElementById("overlay"),vinyl=document.getElementById("vinyl"),padbox=document.getElementById("padbox"),cap=document.getElementById("cap");

const strips=[];
[0,1,2].forEach(z=>{
  const zone=document.createElement("div"); zone.className="zone";
  zone.innerHTML=`<div class="zone-label">${ZONES[z]}</div>`;
  const row=document.createElement("div"); row.className="zone-row";
  CHANNELS.forEach((s,idx)=>{ if(s.zone!==z) return;
    const sz=SIZE[s.size]; const el=document.createElement("div");
    el.className="strip"+(s.type==="spectrum"?" spec":""); el.style.setProperty("--accent",s.color); el.style.width=sz.w+"px";
    let mid="";
    if(s.type==="spectrum"){
      el.style.setProperty("--c0",s.cLo); el.style.setProperty("--c1",s.cHi);
      const N=s.points.length;
      const notches=s.points.map((p,i)=>`<span class="notch" id="notch${idx}_${i}" style="bottom:${((i+0.5)/N*sz.fh).toFixed(1)}px"></span>`).join("");
      mid=`<div class="fadwrap">
        <div class="spec-ends" style="height:${sz.fh}px"><b>${s.endHi}</b><span>${s.endLo}</span></div>
        <input type="range" min="${PARK}" max="0" value="${PARK}" step="0.5" data-id="${idx}" style="height:${sz.fh}px">
        <div class="rail" style="height:${sz.fh}px">${notches}</div></div>
        <div class="specbadge" id="badge${idx}">◐ ${N} 档</div>`;
    } else {
      mid=`<div class="fadwrap"><input type="range" min="${PARK}" max="0" value="${PARK}" step="0.5" data-id="${idx}" style="height:${sz.fh}px"></div>`;
    }
    el.innerHTML=`<div class="tag">${s.tag}</div>${mid}`;
    el.addEventListener("click",(e)=>{ if(e.target.tagName==="INPUT")return; if(busy)return; ensureAudio(); activate(idx); });
    row.appendChild(el); strips[idx]=el;
  });
  zone.appendChild(row); desk.appendChild(zone);
});
const faders=[...document.querySelectorAll("input[type=range]")].sort((a,b)=>a.dataset.id-b.dataset.id);
const faderById={}; faders.forEach(f=>faderById[+f.dataset.id]=f);

let active=-1, busy=false, audioStarted=false;
const curPoint={};
async function ensureAudio(){ if(!audioStarted){ audioStarted=true; try{ await Tone.start(); }catch(e){} } }

function specIndex(ch,v){ const seg=Math.max(0,Math.min(1,(v-THRESHOLD)/(0-THRESHOLD)));
  return Math.min(ch.points.length-1, Math.floor(seg*ch.points.length)); }
function renderParas(arr,mut=false){ segblurb.innerHTML=arr.map(p=>`<p${mut?' class="mut"':''}>${p}</p>`).join(""); }
function showOpening(){ dot.classList.remove("on"); segtxt.textContent="平行水文 · 1976—2026";
  segmeta.textContent="十一条推子 · 三种发声方式并存"; specpos.textContent=""; renderParas(OPENING,true); trackline.textContent=""; }
function showClosing(){ dot.classList.remove("on"); segtxt.textContent="平行水文 · 1976—2026";
  segmeta.textContent=""; specpos.textContent=""; renderParas(CLOSING,true); trackline.textContent=""; }
function updateOnAir(id, idx){
  const s=CHANNELS[id]; dot.classList.add("on"); segtxt.textContent=`${s.ch} · ${s.tag}`;
  if(s.type==="spectrum"){ const p=s.points[idx]; segmeta.textContent=p.label; specpos.textContent="◐ "+p.postag;
    trackline.textContent="▶ "+p.label;
    s.points.forEach((_,i)=>{ const n=document.getElementById(`notch${id}_${i}`); if(n)n.classList.toggle("on", i===idx); }); }
  else { segmeta.textContent=s.track.label; specpos.textContent=""; trackline.textContent="▶ "+s.track.label; }
  renderParas(s.paras); embed.classList.add("live");
}
function stopStream(id,animate=true){ strips[id].classList.remove("active");
  if(CHANNELS[id].type==="spectrum") CHANNELS[id].points.forEach((_,i)=>{ const n=document.getElementById(`notch${id}_${i}`); if(n)n.classList.remove("on"); });
  if(animate)slideDown(faderById[id]); }
function startStream(id){ const s=CHANNELS[id]; strips[id].classList.add("active");
  if(s.type==="spectrum"){ const f=faderById[id];
    if(parseFloat(f.value)<=THRESHOLD) f.value=THRESHOLD+3;
    const idx=specIndex(s,parseFloat(f.value)); curPoint[id]=idx; updateOnAir(id,idx); loadAndPlay(s.points[idx].id);
  } else { const f=faderById[id]; if(parseFloat(f.value)<=PARK+0.5) f.value=-14; updateOnAir(id,0); loadAndPlay(s.track.id); }
}
function slideDown(f){const from=parseFloat(f.value),t0=performance.now();
  (function step(t){const k=Math.min((t-t0)/500,1); f.value=from+(PARK-from)*(1-Math.pow(1-k,3)); if(k<1)requestAnimationFrame(step);})(t0);}

function activate(id){
  if(active===id||busy)return;
  const prev=active,rel=prev>=0?relOf(prev,id):null;
  if(!rel){ if(prev>=0){pauseTrack();stopStream(prev);} active=id;startStream(id);return; }
  busy=true;active=id; cap.innerHTML=rel.cap+`<small>${rel.sub}</small>`;
  overlay.classList.add("show"); pauseTrack();stopStream(prev);
  if(rel.type==="scratch"){ vinyl.classList.add("spin");padbox.classList.remove("show");playScratch();
    setTimeout(()=>startStream(id),1100); setTimeout(()=>{overlay.classList.remove("show");vinyl.classList.remove("spin");busy=false;},2100);
  } else { padbox.classList.add("show");vinyl.classList.remove("spin");playPads(CHANNELS[id].color);
    setTimeout(()=>startStream(id),750); setTimeout(()=>{overlay.classList.remove("show");padbox.classList.remove("show");busy=false;},1900); }
}

faders.forEach(f=>f.addEventListener("input",e=>{
  if(busy)return; ensureAudio();
  const id=+e.target.dataset.id, v=parseFloat(e.target.value), s=CHANNELS[id];
  if(id===active){
    if(v<=PARK+0.5){ pauseTrack();stopStream(id,false);active=-1; dot.classList.remove("on");
      segmeta.textContent="";specpos.textContent="";trackline.textContent="";
      segblurb.innerHTML='<p class="mut">推子归零,这条流下台了。点或推任意一条继续。</p>'; }
    else if(s.type==="spectrum"){ const idx=specIndex(s,v);
      if(idx!==curPoint[id]){ curPoint[id]=idx; updateOnAir(id,idx); loadAndPlay(s.points[idx].id); } }
  } else if(v>THRESHOLD) activate(id);
}));

showOpening();
</script>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
