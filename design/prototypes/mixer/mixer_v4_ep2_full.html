window.onSpotifyIframeApiReady = (IFrameAPI) => {

      if (pendingId) { loadAndPlay(pendingId); pendingId = null; }

function loadAndPlay(id){
  if (!spReady) { pendingId = id; return; }
  spCtrl.loadUri(`spotify:track:${id}`);
  setTimeout(() => spCtrl.play(), 350);
}
function pauseTrack(){ if (spReady) spCtrl.pause(); }

/* ================= 过渡音效(Tone.js 仅用于仪式) ================= */
const scrGain=new Tone.Gain(0).toDestination();
const scrFilter=new Tone.Filter(800,"bandpass");scrFilter.Q.value=6;
const scrNoise=new Tone.Noise("pink");scrNoise.connect(scrFilter);scrFilter.connect(scrGain);
function playScratch(){scrNoise.start();const now=Tone.now(),f=scrFilter.frequency,g=scrGain.gain;
  [[0,.12,400,2600],[.14,.1,2600,500],[.28,.12,500,3000],[.44,.16,3000,300],[.66,.1,300,2200],[.8,.14,2200,600]]
  .forEach(([t,d,a,b])=>{f.setValueAtTime(a,now+t);f.rampTo(b,d,now+t);g.setValueAtTime(.5,now+t);g.rampTo(.05,d,now+t);});
  g.rampTo(0,.2,now+1.0);setTimeout(()=>scrNoise.stop(),1400);}
const padSynth=new Tone.PolySynth(Tone.Synth,{oscillator:{type:"sawtooth"},volume:-8,envelope:{attack:.003,decay:.2,sustain:0,release:.15}}).toDestination();
const padThump=new Tone.MembraneSynth({volume:-4,pitchDecay:.03}).toDestination();
function playPads(color){[["C3","G3"],["D3","A3"],["F3","C4"],["G3","D4"]].forEach((c,i)=>{
  setTimeout(()=>{padThump.triggerAttackRelease("C1","16n");padSynth.triggerAttackRelease(c,"16n");
    const p=document.getElementById("p"+i);p.style.setProperty("--flash",color);
    p.classList.remove("hit");void p.offsetWidth;p.classList.add("hit");},i*160);});}

/* ================= 界面 ================= */
const desk=document.getElementById("desk");
const dot=document.getElementById("dot"), segtxt=document.getElementById("segtxt"),
      segmeta=document.getElementById("segmeta"), segblurb=document.getElementById("segblurb"),
      embed=document.getElementById("embed"), trackline=document.getElementById("trackline");
const overlay=document.getElementById("overlay"),vinyl=document.getElementById("vinyl"),
      padbox=document.getElementById("padbox"),cap=document.getElementById("cap");

const strips=CHANNELS.map((s,idx)=>{const el=document.createElement("div");
  el.className="strip";el.style.setProperty("--accent",s.color);
  el.innerHTML=`<div class="chno">${s.ch}</div><div class="tag">${s.tag}</div><div class="year">${s.year}</div>
    <div class="fadwrap"><input type="range" min="${PARK}" max="0" value="${PARK}" step="0.5" data-id="${idx}">
    <div class="vu"><i id="vu${idx}"></i></div></div>`;
  desk.appendChild(el);return el;});
const faders=[...document.querySelectorAll("input[type=range]")];

let active=-1,powered=false,busy=false;

function renderParas(arr, mut=false){
  segblurb.innerHTML = arr.map(p=>`<p${mut?' class="mut"':''}>${p}</p>`).join("");
}
function showOpening(){
  dot.classList.remove("on");
  segtxt.textContent="平行水文 · 1976—2026";
  segmeta.textContent="十条推子 · 十条还活着的支流";
  renderParas(OPENING, true);
  trackline.textContent="";
}
function showClosing(){
  dot.classList.remove("on");
  segtxt.textContent="平行水文 · 1976—2026";
  segmeta.textContent="";
  renderParas(CLOSING, true);
  trackline.textContent="";
}
function updateOnAir(id){
  const s=CHANNELS[id];
  dot.classList.add("on");
  segtxt.textContent=`${s.ch} · ${s.tag}`;
  segmeta.textContent=s.track.label;
  renderParas(s.paras);
  trackline.textContent="▶ "+s.track.label;
  embed.classList.add("live");
}
function stopStream(id,animate=true){
  strips[id].classList.remove("active");
  if(animate)slideDown(faders[id]);
}
function startStream(id){
  strips[id].classList.add("active");
  updateOnAir(id);
  loadAndPlay(CHANNELS[id].track.id);
}
function slideDown(fader){const from=parseFloat(fader.value),t0=performance.now();
  (function step(t){const k=Math.min((t-t0)/500,1);
    fader.value=from+(PARK-from)*(1-Math.pow(1-k,3));
    if(k<1)requestAnimationFrame(step);})(t0);}

function activate(id){
  if(active===id||busy)return;
  const prev=active,rel=prev>=0?relOf(prev,id):null;
  if(!rel){
    if(prev>=0){pauseTrack();stopStream(prev);}
    active=id;startStream(id);return;
  }
  busy=true;active=id;
  cap.innerHTML=rel.cap+`<small>${rel.sub}</small>`;
  overlay.classList.add("show");
  pauseTrack();stopStream(prev);
  if(rel.type==="scratch"){
    vinyl.classList.add("spin");padbox.classList.remove("show");
    playScratch();
    setTimeout(()=>startStream(id),1100);
    setTimeout(()=>{overlay.classList.remove("show");vinyl.classList.remove("spin");busy=false;},2100);
  }else{
    padbox.classList.add("show");vinyl.classList.remove("spin");
    playPads(CHANNELS[id].color);
    setTimeout(()=>startStream(id),750);
    setTimeout(()=>{overlay.classList.remove("show");padbox.classList.remove("show");busy=false;},1900);
  }
}

faders.forEach(f=>f.addEventListener("input",e=>{
  if(!powered||busy)return;
  const id=+e.target.dataset.id,v=parseFloat(e.target.value);
  if(id===active){
    if(v<=PARK+0.5){ /* 自己拉到底 = 下台 */
      pauseTrack();stopStream(id,false);active=-1;
      dot.classList.remove("on");
      segmeta.textContent="";trackline.textContent="";
      segblurb.innerHTML='<p class="mut">推子归零,这条流下台了。推任意一条继续。</p>';
    }
  }
  else if(v>THRESHOLD)activate(id);
}));

/* VU:视觉演出(Spotify iframe 无电平接口) */
let vuLevel=0;
(function vu(){
  CHANNELS.forEach((_,i)=>{
    let h=0;
    if(i===active&&powered){
      vuLevel += (Math.random()*90+8-vuLevel)*0.18;
      h=vuLevel;
    } else if(i===active){ h=0; }
    document.getElementById("vu"+i).style.height=h+"%";
  });
  requestAnimationFrame(vu);
})();

const btn=document.getElementById("power");
btn.addEventListener("click",async()=>{
  await Tone.start();powered=!powered;
  if(powered){
    btn.textContent="OFF AIR?";btn.classList.add("on");
    segblurb.innerHTML='<p class="mut">往上推任意一条推子——越过阈值就上台,ON AIR 面板跟着换。</p>';
  } else {
    if(active>=0){pauseTrack();stopStream(active);active=-1;}
    btn.textContent="POWER";btn.classList.remove("on");
    showClosing();
  }
});

showOpening();
</script>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
