<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mixer v2 · 过渡语法:有交集→打碟/pad,无交集→普通切换</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
  :root {
    --bg: #2b2b2b; --strip: #383838; --line: #4a4a4a;
    --txt: #d8d4cc; --dim: #8a867e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--txt);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px; padding: 24px;
  }
  h1 { font-size: 12px; font-weight: 400; color: var(--dim); letter-spacing: .12em; }
  .desk { display: flex; gap: 12px; }
  .strip {
    background: var(--strip); border: 1px solid var(--line); border-radius: 6px;
    padding: 12px 10px 16px; width: 108px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    transition: border-color .4s;
  }
  .strip.active { border-color: var(--accent); }
  .tag {
    font-size: 10px; padding: 3px 6px; border-radius: 3px; color: #222;
    width: 100%; text-align: center; background: var(--accent);
    opacity: .45; transition: opacity .4s;
  }
  .strip.active .tag { opacity: 1; }
  .year { font-size: 9px; color: var(--dim); }
  .fadwrap { display: flex; gap: 6px; align-items: center; height: 170px; }
  input[type=range] {
    writing-mode: vertical-lr; direction: rtl;
    width: 24px; height: 170px; accent-color: var(--txt); cursor: pointer;
  }
  .vu { width: 5px; height: 170px; background: #222; border-radius: 2px; position: relative; overflow: hidden; }
  .vu i { position: absolute; bottom: 0; left: 0; right: 0; height: 0%;
    background: var(--accent); border-radius: 2px; transition: height .08s linear; }
  .np { font-size: 11px; color: var(--dim); min-height: 30px; max-width: 500px; text-align: center; line-height: 1.7; }
  .np b { color: var(--txt); font-weight: 400; }
  button {
    background: none; border: 1px solid var(--line); color: var(--txt);
    font: inherit; font-size: 12px; padding: 8px 22px; border-radius: 4px;
    cursor: pointer; letter-spacing: .08em;
  }
  button.on { border-color: #e0a458; color: #e0a458; }
  .hint { font-size: 10px; color: var(--dim); max-width: 480px; text-align: center; line-height: 1.7; }

  /* ---- 过渡覆盖层 ---- */
  #overlay {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 18px;
    background: rgba(20,20,20,.82); z-index: 10;
  }
  #overlay.show { display: flex; }
  .caption { font-size: 12px; color: var(--txt); max-width: 420px; text-align: center; line-height: 1.9; }
  .caption small { color: var(--dim); display: block; margin-top: 4px; font-size: 10px; }

  /* 转盘 */
  #vinyl { width: 130px; height: 130px; border-radius: 50%; display: none;
    background:
      radial-gradient(circle at 50% 50%, #d8d4cc 0 12%, #1c1c1c 12.5% 13%, transparent 13%),
      repeating-radial-gradient(circle at 50% 50%, #1a1a1a 0 3px, #242424 3px 6px);
    border: 1px solid #4a4a4a; position: relative;
  }
  #vinyl::after { content:""; position: absolute; top: 6px; left: 50%; width: 2px; height: 26px;
    background: #d8d4cc; transform-origin: bottom; opacity: .7; }
  #vinyl.spin { display: block; animation: brake 1.6s cubic-bezier(.2,.8,.4,1) forwards; }
  @keyframes brake {
    0%   { transform: rotate(0turn); }
    55%  { transform: rotate(1.6turn); }
    75%  { transform: rotate(1.45turn); }   /* 倒拉一下 = scratch */
    88%  { transform: rotate(1.75turn); }
    100% { transform: rotate(2turn); }
  }
  /* pad */
  #padbox { display: none; gap: 10px; }
  #padbox.show { display: flex; }
  .pad { width: 56px; height: 56px; border-radius: 8px; background: #444; border: 1px solid #555; }
  .pad.hit { animation: padflash .18s ease-out; }
  @keyframes padflash { 0% { background: var(--flash, #7ea87e); box-shadow: 0 0 22px var(--flash, #7ea87e); } 100% { background: #444; } }
</style>
</head>
<body>
  <h1>MIXER v2 — 有交集:打碟 / pad 过渡;无交集:普通切换</h1>
  <div class="desk" id="desk"></div>
  <p class="np" id="np">先点 POWER。试试 FUSION → HIP-HOP(scratch),HIP-HOP → UK(pad),SMOOTH → UK(普通)</p>
  <button id="power">POWER</button>
  <p class="hint">过渡语法:交叉点在切换的一瞬间被"演"出来——搓碟对应 Rockit 那条血缘,pad 对应采样文化。<br>字幕浮现连线是谁牵的。占位音色,验证的是过渡的手感和叙事感。</p>

  <div id="overlay">
    <div id="vinyl"></div>
    <div id="padbox"><div class="pad" id="p0"></div><div class="pad" id="p1"></div><div class="pad" id="p2"></div><div class="pad" id="p3"></div></div>
    <div class="caption" id="cap"></div>
  </div>

<script>
/* ---------- 流(同 v1) ---------- */
const STREAMS = [
  { name:"FUSION",  year:"1976", color:"#e0a458", bpm:118, blurb:"<b>Fusion 的余波</b> —— 电吉他、合成器接管,jazz 插上了电" },
  { name:"SMOOTH",  year:"1980", color:"#c9b8d8", bpm:76,  blurb:"<b>Smooth</b> —— 顺到没有棱角,黄昏感是真的" },
  { name:"HIP-HOP", year:"1991", color:"#7ea87e", bpm:90,  blurb:"<b>Hip-hop 融合</b> —— 采样台上的 jazz,碎拍是信仰" },
  { name:"UK WAVE", year:"2015", color:"#6fc2b8", bpm:132, blurb:"<b>UK 新浪潮</b> —— 年轻、跳舞、出汗,dub 的回声在血里" },
];

/* ---------- 交集地图:哪两条流之间有故事,用什么仪式过渡 ----------
   注:连线文案对应 landscape 第 13 节交叉点;正式版逐条再核 */
const REL = {
  "0-2": { type:"scratch", cap:"Herbie Hancock〈Rockit〉· 1983", sub:"一个 fusion 大佬亲手玩搓碟,提前十年预告了这场联姻" },
  "0-1": { type:"scratch", cap:"同一股电流的两个分叉", sub:"fusion 的电,一叉商业化成了 smooth" },
  "2-3": { type:"pad",     cap:"采样文化过海 · MPC 到伦敦", sub:"碎拍从采样器流进俱乐部,UK 把它接进舞池" },
};
const relOf = (a,b) => REL[`${Math.min(a,b)}-${Math.max(a,b)}`] || null;

const THRESHOLD = -30, PARK = -48;

/* ---------- 音色(同 v1,略有精简) ---------- */
const master = new Tone.Gain(0.9);
const masterFilter = new Tone.Filter(18000, "lowpass");
master.connect(masterFilter); masterFilter.toDestination();
const meters = [], channels = [], patterns = [];
STREAMS.forEach(() => {
  const ch = new Tone.Channel(-10);
  const m = new Tone.Meter({ smoothing: 0.85 });
  ch.connect(m); ch.connect(master); ch.volume.value = -Infinity;
  channels.push(ch); meters.push(m);
});
{ const ep = new Tone.PolySynth(Tone.Synth,{oscillator:{type:"square"},volume:-14,envelope:{attack:.004,decay:.18,sustain:.05,release:.1}}).connect(channels[0]);
  const bs = new Tone.MonoSynth({oscillator:{type:"sawtooth"},volume:-10,envelope:{attack:.01,decay:.2,sustain:.3,release:.2},filterEnvelope:{baseFrequency:300,octaves:2,decay:.15}}).connect(channels[0]);
  const n=["E4","G4","B4","D5","B4","G4"], b=["E2","E2","G2","A2"]; let i=0,j=0;
  patterns[0]=[new Tone.Loop(t=>ep.triggerAttackRelease(n[i++%6],"16n",t),"8n"), new Tone.Loop(t=>bs.triggerAttackRelease(b[j++%4],"8n",t),"4n")]; }
{ const ld = new Tone.Synth({oscillator:{type:"sine"},volume:-8,portamento:.08,envelope:{attack:.06,decay:.3,sustain:.5,release:.6}}).connect(channels[1]);
  const pd = new Tone.PolySynth(Tone.Synth,{oscillator:{type:"triangle"},volume:-16,envelope:{attack:.3,decay:.5,sustain:.4,release:1.2}}).connect(channels[1]);
  const m=["G4","A4","C5","A4"], c=[["F3","A3","C4"],["E3","G3","C4"]]; let i=0,j=0;
  patterns[1]=[new Tone.Loop(t=>ld.triggerAttackRelease(m[i++%4],"4n",t),"2n"), new Tone.Loop(t=>pd.triggerAttackRelease(c[j++%2],"2n",t),"1m")]; }
{ const k = new Tone.MembraneSynth({volume:-4,pitchDecay:.04}).connect(channels[2]);
  const s = new Tone.NoiseSynth({volume:-10,envelope:{attack:.001,decay:.14,sustain:0}}).connect(channels[2]);
  const sub = new Tone.MonoSynth({oscillator:{type:"sine"},volume:-8,envelope:{attack:.01,decay:.3,sustain:.2,release:.2}}).connect(channels[2]);
  let st=0;
  patterns[2]=[new Tone.Loop(t=>{const x=st++%8; if(x===0||x===3||x===6)k.triggerAttackRelease("C1","8n",t); if(x===2||x===6)s.triggerAttackRelease("16n",t+0.012); if(x===0)sub.triggerAttackRelease("F1","4n",t);},"8n")]; }
{ const dub = new Tone.FeedbackDelay("8n.",0.5).connect(channels[3]);
  const tm = new Tone.MembraneSynth({volume:-8,pitchDecay:.08,octaves:3}).connect(channels[3]);
  const stb = new Tone.PolySynth(Tone.Synth,{oscillator:{type:"sawtooth"},volume:-14,envelope:{attack:.005,decay:.12,sustain:0,release:.1}}).connect(dub);
  let st=0;
  patterns[3]=[new Tone.Loop(t=>{const x=st++%8; tm.triggerAttackRelease(x%2?"G2":"C2","16n",t); if(x===4)stb.triggerAttackRelease(["D4","F4","A4"],"16n",t);},"8n")]; }

/* ---------- 过渡音效 ---------- */
/* scratch:带通噪声 + 快速扫频 = wika-wika */
const scrGain = new Tone.Gain(0).toDestination();
const scrFilter = new Tone.Filter(800, "bandpass"); scrFilter.Q.value = 6;
const scrNoise = new Tone.Noise("pink"); scrNoise.connect(scrFilter); scrFilter.connect(scrGain);
function playScratch() {
  scrNoise.start();
  const now = Tone.now(), f = scrFilter.frequency, g = scrGain.gain;
  const moves = [[0,.12,400,2600],[.14,.1,2600,500],[.28,.12,500,3000],[.44,.16,3000,300],[.66,.1,300,2200],[.8,.14,2200,600]];
  moves.forEach(([t,d,a,b]) => { f.setValueAtTime(a, now+t); f.rampTo(b, d, now+t);
    g.setValueAtTime(.5, now+t); g.rampTo(0.05, d, now+t); });
  g.rampTo(0, .2, now+1.0);
  setTimeout(() => scrNoise.stop(), 1400);
}
/* pad:四连 stab */
const padSynth = new Tone.PolySynth(Tone.Synth,{oscillator:{type:"sawtooth"},volume:-8,envelope:{attack:.003,decay:.2,sustain:0,release:.15}}).toDestination();
const padThump = new Tone.MembraneSynth({volume:-4,pitchDecay:.03}).toDestination();
function playPads(color) {
  const chords = [["C3","G3"],["D3","A3"],["F3","C4"],["G3","D4"]];
  chords.forEach((c,i) => {
    setTimeout(() => {
      padThump.triggerAttackRelease("C1","16n");
      padSynth.triggerAttackRelease(c,"16n");
      const p = document.getElementById("p"+i);
      p.style.setProperty("--flash", color);
      p.classList.remove("hit"); void p.offsetWidth; p.classList.add("hit");
    }, i*160);
  });
}

/* ---------- 界面 ---------- */
const desk = document.getElementById("desk"), np = document.getElementById("np");
const overlay = document.getElementById("overlay"), vinyl = document.getElementById("vinyl"),
      padbox = document.getElementById("padbox"), cap = document.getElementById("cap");
const strips = STREAMS.map((s,idx) => {
  const el = document.createElement("div");
  el.className = "strip"; el.style.setProperty("--accent", s.color);
  el.innerHTML = `<div class="tag">${s.name}</div><div class="year">${s.year}</div>
    <div class="fadwrap"><input type="range" min="${PARK}" max="0" value="${PARK}" step="0.5" data-id="${idx}">
    <div class="vu"><i id="vu${idx}"></i></div></div>`;
  desk.appendChild(el); return el;
});
const faders = [...document.querySelectorAll("input[type=range]")];

/* ---------- 切换核心 ---------- */
let active = -1, powered = false, busy = false;

function stopStream(id, animate=true) {
  patterns[id].forEach(p => p.stop());
  channels[id].volume.value = -Infinity;
  strips[id].classList.remove("active");
  if (animate) slideDown(faders[id]);
}
function startStream(id) {
  Tone.Transport.bpm.rampTo(STREAMS[id].bpm, 0.3);
  patterns[id].forEach(p => p.start(0));
  channels[id].volume.value = parseFloat(faders[id].value);
  strips[id].classList.add("active");
  np.innerHTML = STREAMS[id].blurb + ` <span style="opacity:.6">· ${STREAMS[id].bpm} BPM</span>`;
}
function slideDown(fader) {
  const from = parseFloat(fader.value), t0 = performance.now();
  (function step(t){ const k = Math.min((t-t0)/500,1);
    fader.value = from + (PARK-from)*(1-Math.pow(1-k,3));
    if (k<1) requestAnimationFrame(step); })(t0);
}

function activate(id) {
  if (active === id || busy) return;
  const prev = active;
  const rel = prev >= 0 ? relOf(prev, id) : null;
  if (!rel) {           // 无交集:普通切换(v1 行为)
    if (prev >= 0) stopStream(prev);
    active = id; startStream(id); return;
  }
  /* 有交集:过渡仪式 */
  busy = true; active = id;
  cap.innerHTML = rel.cap + `<small>${rel.sub}</small>`;
  overlay.classList.add("show");
  if (rel.type === "scratch") {
    vinyl.classList.add("spin"); padbox.classList.remove("show");
    masterFilter.frequency.rampTo(500, 0.5);            // 唱片刹车:声音闷下去
    Tone.Transport.bpm.rampTo(Math.max(40, STREAMS[prev].bpm*0.4), 0.6);
    playScratch();
    setTimeout(() => {
      stopStream(prev);
      masterFilter.frequency.rampTo(18000, 0.3);
      startStream(id);
    }, 1100);
    setTimeout(() => { overlay.classList.remove("show"); vinyl.classList.remove("spin"); busy = false; }, 2100);
  } else {              // pad
    padbox.classList.add("show"); vinyl.classList.remove("spin");
    stopStream(prev);
    playPads(STREAMS[id].color);
    setTimeout(() => startStream(id), 700);
    setTimeout(() => { overlay.classList.remove("show"); padbox.classList.remove("show"); busy = false; }, 1900);
  }
}

faders.forEach(f => f.addEventListener("input", e => {
  if (!powered || busy) return;
  const id = +e.target.dataset.id, v = parseFloat(e.target.value);
  if (id === active) channels[id].volume.value = v <= PARK ? -Infinity : v;
  else if (v > THRESHOLD) activate(id);
}));

(function vu(){ meters.forEach((m,i)=>{ const db=m.getValue();
  const h = db===-Infinity?0:Math.max(0,Math.min(100,(db+48)/48*100));
  document.getElementById("vu"+i).style.height=h+"%"; }); requestAnimationFrame(vu); })();

const btn = document.getElementById("power");
btn.addEventListener("click", async () => {
  await Tone.start();
  powered = !powered;
  if (powered) { Tone.Transport.start(); btn.textContent="OFF AIR?"; btn.classList.add("on");
    np.textContent = "推起任意一条。带交集的切换会有仪式"; }
  else { if (active>=0) { stopStream(active); active=-1; }
    Tone.Transport.stop(); btn.textContent="POWER"; btn.classList.remove("on");
    np.textContent = "先点 POWER"; }
});
</script>
</body>
</html>
