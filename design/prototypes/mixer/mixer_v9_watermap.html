<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>

  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:radial-gradient(130% 90% at 50% 0%, #C8C6BD 0%, var(--bg) 46%, #A5A397 100%);
    color:var(--ink); font-family:"JetBrains Mono",ui-monospace,monospace; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; overflow-x:hidden; }

  /* ===== 整页底图:血缘水系图(铺满,填满所有空白)===== */
  #watermap { position:fixed; inset:0; width:100vw; height:100vh; z-index:0; pointer-events:none; }
  .stie { stroke:#8a877c; stroke-width:1.4; opacity:.3; transition:stroke-width .3s, opacity .3s, stroke .3s; }
  .stie.on { stroke:var(--tc,#8a877c); stroke-width:3; opacity:.85; }
  .snode circle { opacity:.62; transition:opacity .35s, r .35s; }
  .snode .nm { font-size:14px; opacity:.72; transition:opacity .35s; letter-spacing:.04em; }
  .snode .nt { fill:var(--dim); font-size:10.5px; opacity:.5; transition:opacity .35s; letter-spacing:.02em; }
  .snode.on circle { opacity:1; filter:drop-shadow(0 0 11px var(--nc)); }
  .snode.on .nm { opacity:1; }
  .snode.on .nt { opacity:.9; fill:var(--ink); }

  #screen { position:relative; z-index:2; width:100%; max-width:1000px; margin-top:24px;
    background:linear-gradient(165deg, rgba(40,39,35,.90), rgba(26,25,22,.93));
    border:1px solid #3a3934; border-radius:14px; padding:20px 26px 22px; display:flex; gap:24px; align-items:flex-start;
    min-height:210px; color:#E7E4DA; box-shadow:0 12px 38px rgba(45,44,38,.4), inset 0 1px 0 rgba(255,255,255,.06);
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); }
  #nowinfo { flex:1; min-width:0; }
  #segtitle { font-size:15px; margin-bottom:4px; display:flex; align-items:center; gap:9px; color:#F0EEE4; }
  #dot { width:9px; height:9px; border-radius:50%; background:#6f6c62; flex-shrink:0; transition:.4s; }
  #dot.on { background:#57c268; box-shadow:0 0 9px rgba(87,194,104,.7); }
  #segmeta { font-size:10.5px; color:#B4B0A4; margin-bottom:6px; letter-spacing:.04em; }
  #specpos { font-size:10px; color:#D8B45E; margin-bottom:8px; min-height:12px; letter-spacing:.05em; }
  #segblurb { font-size:12px; color:#E4E0D5; line-height:1.95; max-width:560px; }
  #segblurb p + p { margin-top:9px; } #segblurb .mut { color:#9d998f; }
  #embedcol { width:320px; flex-shrink:0; display:flex; flex-direction:column; gap:8px; }
  #embed { width:100%; min-height:80px; border:1px dashed #45443e; border-radius:12px; display:flex;
    align-items:center; justify-content:center; font-size:10px; color:#8f8b81; text-align:center; overflow:hidden; }
  #embed.live { border:none; } #embed iframe { border-radius:12px; display:block; }
  #trackline { font-size:9.5px; color:#a29e94; line-height:1.7; text-align:right; }

  /* ===== 调音台:俯视 A(整台平铺,推子跟台面一起躺进纵深)===== */
  #stage { position:relative; z-index:1; width:100%; max-width:1000px; margin-top:56px; margin-bottom:120px;
    perspective:1050px; perspective-origin:50% 42%; }
  #glass { transform:rotateX(60deg); transform-origin:50% 100%;
    background:linear-gradient(158deg, rgba(216,214,204,.42), rgba(188,186,176,.24));
    border:1px solid rgba(255,255,255,.5); border-radius:18px; padding:20px 18px 16px;

  .zone-row { display:flex; gap:8px; justify-content:center; align-items:flex-end; flex:1; }
  .strip { background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.44); border-radius:10px;

  .tag { font-size:8.5px; padding:3px 3px; border-radius:4px; color:#fff; width:100%; text-align:center;

    transition:opacity .35s, box-shadow .35s; text-shadow:0 1px 1px rgba(0,0,0,.3); }
  .strip.active .tag { opacity:1; box-shadow:0 0 10px -1px var(--accent); }
  .fadwrap { display:flex; gap:4px; align-items:center; }
  input[type=range] { writing-mode:vertical-lr; direction:rtl; width:20px; accent-color:var(--accent);
    cursor:pointer; filter:drop-shadow(0 0 3px var(--accent)); }
  .rail { width:7px; border-radius:4px; position:relative;
    background:linear-gradient(to top, var(--c0), var(--c1)); box-shadow:inset 0 0 3px rgba(0,0,0,.2); }
  .notch { position:absolute; left:50%; width:9px; height:9px; border-radius:50%;
    transform:translate(-50%,50%); background:rgba(45,44,36,.30); border:1px solid rgba(255,255,255,.55);
    transition:background .25s, box-shadow .25s, transform .25s; }
  .notch.on { background:var(--accent); border-color:#fff; box-shadow:0 0 9px var(--accent); transform:translate(-50%,50%) scale(1.3); }

  /* 过渡覆盖层 */
  #overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:18px; background:rgba(40,39,34,.58); backdrop-filter:blur(3px); z-index:10; }
  #overlay.show { display:flex; }
  .caption { font-size:12.5px; color:#F0EEE4; max-width:460px; text-align:center; line-height:1.9; padding:0 20px; }
  .caption small { color:#C9C6BB; display:block; margin-top:6px; font-size:10px; line-height:1.8; }
  #vinyl { width:130px; height:130px; border-radius:50%; display:none;
    background:radial-gradient(circle at 50% 50%, #E4E1D6 0 12%, #2a2925 12.5% 13%, transparent 13%),
      repeating-radial-gradient(circle at 50% 50%, #26251f 0 3px, #34322b 3px 6px); border:1px solid #55524a; position:relative; }
  #vinyl::after { content:""; position:absolute; top:6px; left:50%; width:2px; height:26px; background:#E4E1D6; transform-origin:bottom; opacity:.7; }
  #vinyl.spin { display:block; animation:brake 1.6s cubic-bezier(.2,.8,.4,1) forwards; }
  @keyframes brake { 0%{transform:rotate(0turn)} 55%{transform:rotate(1.6turn)} 75%{transform:rotate(1.45turn)} 88%{transform:rotate(1.75turn)} 100%{transform:rotate(2turn)} }
  #padbox { display:none; gap:10px; } #padbox.show { display:flex; }
  .pad { width:56px; height:56px; border-radius:8px; background:#4a4840; border:1px solid #5c5a50; }
  .pad.hit { animation:padflash .18s ease-out; }
  @keyframes padflash { 0%{background:var(--flash,#7ea87e);box-shadow:0 0 22px var(--flash,#7ea87e)} 100%{background:#4a4840} }
</style>

  "HIP-HOP":"采样台上的 jazz", "NU JAZZ":"喂给机器的 jazz", "JAPAN":"自成生态的精密",
  "SPIRITUAL":"大、向上、迷狂", "UK WAVE":"年轻、跳舞、diaspora", "LATIN":"加勒比的节奏心脏",
  "JAM":"现场为王,groove 管够", "NEW STD":"当代原声,作曲驱动",
};
const posOf = t => STARPOS[t];
const smap = document.getElementById("watermap");
Object.keys(REL).forEach(k=>{ const [a,b]=k.split("-").map(Number); const A=posOf(CHANNELS[a].tag), B=posOf(CHANNELS[b].tag);
  const l=document.createElementNS(SVGNS,"line"); l.setAttribute("x1",A[0]); l.setAttribute("y1",A[1]);
  l.setAttribute("x2",B[0]); l.setAttribute("y2",B[1]); l.setAttribute("class","stie"); l.id="stie_"+k; smap.appendChild(l); });
CHANNELS.forEach((s,i)=>{ const p=posOf(s.tag); const right=p[0]>760; const tx=right?p[0]-13:p[0]+13; const anc=right?"end":"start";
  const g=document.createElementNS(SVGNS,"g"); g.setAttribute("class","snode"); g.id="snode_"+i; g.style.setProperty("--nc",s.color);
  const c=document.createElementNS(SVGNS,"circle"); c.setAttribute("cx",p[0]); c.setAttribute("cy",p[1]); c.setAttribute("r",7); c.setAttribute("fill",s.color); g.appendChild(c);
  const nm=document.createElementNS(SVGNS,"text"); nm.setAttribute("class","nm"); nm.setAttribute("x",tx); nm.setAttribute("y",p[1]-1);
  nm.setAttribute("text-anchor",anc); nm.setAttribute("fill",s.color); nm.textContent=s.tag; g.appendChild(nm);
  const nt=document.createElementNS(SVGNS,"text"); nt.setAttribute("class","nt"); nt.setAttribute("x",tx); nt.setAttribute("y",p[1]+14);
  nt.setAttribute("text-anchor",anc); nt.textContent=NOTE[s.tag]; g.appendChild(nt); smap.appendChild(g); });
function highlightNode(id){ CHANNELS.forEach((_,i)=>{ const n=document.getElementById("snode_"+i); if(n)n.classList.toggle("on", i===id); }); }
function clearNodes(){ CHANNELS.forEach((_,i)=>{ const n=document.getElementById("snode_"+i); if(n)n.classList.remove("on"); }); }
function flashTie(a,b){ const el=document.getElementById(`stie_${Math.min(a,b)}-${Math.max(a,b)}`);
  if(el){ el.style.setProperty("--tc", CHANNELS[a].color); el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),2200); } }

/* ===== Spotify iframe API ===== */
let spCtrl=null, spReady=false, pendingId=null;
window.onSpotifyIframeApiReady = (API) => { const box=document.getElementById("embed"); box.innerHTML=""; box.classList.add("live");
  const h=document.createElement("div"); box.appendChild(h);
  API.createController(h,{ uri:`spotify:track:${CHANNELS[9].points[0].id}`, width:"100%", height:80 },
    (c)=>{ spCtrl=c; spReady=true; if(pendingId){loadAndPlay(pendingId);pendingId=null;} }); };
function loadAndPlay(id){ if(!spReady){pendingId=id;return;} spCtrl.loadUri(`spotify:track:${id}`); setTimeout(()=>spCtrl.play(),350); }
function pauseTrack(){ if(spReady)spCtrl.pause(); }

/* ===== 过渡音效 ===== */
const scrGain=new Tone.Gain(0).toDestination(); const scrFilter=new Tone.Filter(800,"bandpass"); scrFilter.Q.value=6;
const scrNoise=new Tone.Noise("pink"); scrNoise.connect(scrFilter); scrFilter.connect(scrGain);
function playScratch(){scrNoise.start();const now=Tone.now(),f=scrFilter.frequency,g=scrGain.gain;
  [[0,.12,400,2600],[.14,.1,2600,500],[.28,.12,500,3000],[.44,.16,3000,300],[.66,.1,300,2200],[.8,.14,2200,600]]
  .forEach(([t,d,a,b])=>{f.setValueAtTime(a,now+t);f.rampTo(b,d,now+t);g.setValueAtTime(.5,now+t);g.rampTo(.05,d,now+t);});
  g.rampTo(0,.2,now+1.0);setTimeout(()=>scrNoise.stop(),1400);}
const padSynth=new Tone.PolySynth(Tone.Synth,{oscillator:{type:"sawtooth"},volume:-8,envelope:{attack:.003,decay:.2,sustain:0,release:.15}}).toDestination();
const padThump=new Tone.MembraneSynth({volume:-4,pitchDecay:.03}).toDestination();
function playPads(color){[["C3","G3"],["D3","A3"],["F3","C4"],["G3","D4"]].forEach((c,i)=>{
  setTimeout(()=>{padThump.triggerAttackRelease("C1","16n");padSynth.triggerAttackRelease(c,"16n");
    const p=document.getElementById("p"+i);p.style.setProperty("--flash",color);
    p.classList.remove("hit");void p.offsetWidth;p.classList.add("hit");},i*160);});}

/* ===== 调音台界面 ===== */
const desk=document.getElementById("glass");
const dot=document.getElementById("dot"), segtxt=document.getElementById("segtxt"), segmeta=document.getElementById("segmeta"),
      specpos=document.getElementById("specpos"), segblurb=document.getElementById("segblurb"),
      embed=document.getElementById("embed"), trackline=document.getElementById("trackline");
const overlay=document.getElementById("overlay"),vinyl=document.getElementById("vinyl"),padbox=document.getElementById("padbox"),cap=document.getElementById("cap");

const strips=[];
[0,1,2].forEach(z=>{ const zone=document.createElement("div"); zone.className="zone";
  zone.innerHTML=`<div class="zone-label">${ZONES[z]}</div>`;
  const row=document.createElement("div"); row.className="zone-row";
  CHANNELS.forEach((s,idx)=>{ if(s.zone!==z) return; const sz=SIZE[s.size]; const el=document.createElement("div");
    el.className="strip"+(s.type==="spectrum"?" spec":""); el.style.setProperty("--accent",s.color); el.style.width=sz.w+"px";
    let mid="";
    if(s.type==="spectrum"){ el.style.setProperty("--c0",s.cLo); el.style.setProperty("--c1",s.cHi); const N=s.points.length;
      const notches=s.points.map((p,i)=>`<span class="notch" id="notch${idx}_${i}" style="bottom:${((i+0.5)/N*sz.fh).toFixed(1)}px"></span>`).join("");
      mid=`<div class="fadwrap"><input type="range" min="${PARK}" max="0" value="${PARK}" step="0.5" data-id="${idx}" style="height:${sz.fh}px">
        <div class="rail" style="height:${sz.fh}px">${notches}</div></div>`;
    } else { mid=`<div class="fadwrap"><input type="range" min="${PARK}" max="0" value="${PARK}" step="0.5" data-id="${idx}" style="height:${sz.fh}px"></div>`; }
    el.innerHTML=`<div class="tag">${s.tag}</div>${mid}`;
    el.addEventListener("click",(e)=>{ if(e.target.tagName==="INPUT")return; if(busy)return; ensureAudio(); activate(idx); });
    row.appendChild(el); strips[idx]=el; });
  zone.appendChild(row); desk.appendChild(zone); });
const faders=[...document.querySelectorAll("input[type=range]")]; const faderById={}; faders.forEach(f=>faderById[+f.dataset.id]=f);

let active=-1, busy=false, audioStarted=false; const curPoint={};
async function ensureAudio(){ if(!audioStarted){ audioStarted=true; try{ await Tone.start(); }catch(e){} } }
function specIndex(ch,v){ const seg=Math.max(0,Math.min(1,(v-THRESHOLD)/(0-THRESHOLD))); return Math.min(ch.points.length-1, Math.floor(seg*ch.points.length)); }
function renderParas(arr,mut=false){ segblurb.innerHTML=arr.map(p=>`<p${mut?' class="mut"':''}>${p}</p>`).join(""); }
function showOpening(){ dot.classList.remove("on"); clearNodes(); segtxt.textContent="平行水文 · 1976—2026";
  segmeta.textContent="十一条支流 · 三种发声方式并存"; specpos.textContent=""; renderParas(OPENING,true); trackline.textContent=""; }
function showClosing(){ dot.classList.remove("on"); clearNodes(); segtxt.textContent="平行水文 · 1976—2026";
  segmeta.textContent=""; specpos.textContent=""; renderParas(CLOSING,true); trackline.textContent=""; }
function updateOnAir(id, idx){ const s=CHANNELS[id]; dot.classList.add("on"); highlightNode(id); segtxt.textContent=`${s.ch} · ${s.tag}`;
  if(s.type==="spectrum"){ const p=s.points[idx]; segmeta.textContent=p.label; specpos.textContent="◐ "+p.postag; trackline.textContent="▶ "+p.label;
    s.points.forEach((_,i)=>{ const n=document.getElementById(`notch${id}_${i}`); if(n)n.classList.toggle("on", i===idx); }); }
  else { segmeta.textContent=s.track.label; specpos.textContent=""; trackline.textContent="▶ "+s.track.label; }
  renderParas(s.paras); embed.classList.add("live"); }
function stopStream(id,animate=true){ strips[id].classList.remove("active");
  if(CHANNELS[id].type==="spectrum") CHANNELS[id].points.forEach((_,i)=>{ const n=document.getElementById(`notch${id}_${i}`); if(n)n.classList.remove("on"); });
  if(animate)slideDown(faderById[id]); }
function startStream(id){ const s=CHANNELS[id]; strips[id].classList.add("active");
  if(s.type==="spectrum"){ const f=faderById[id]; if(parseFloat(f.value)<=THRESHOLD) f.value=THRESHOLD+3;
    const idx=specIndex(s,parseFloat(f.value)); curPoint[id]=idx; updateOnAir(id,idx); loadAndPlay(s.points[idx].id); }
  else { const f=faderById[id]; if(parseFloat(f.value)<=PARK+0.5) f.value=-14; updateOnAir(id,0); loadAndPlay(s.track.id); } }
function slideDown(f){const from=parseFloat(f.value),t0=performance.now();
  (function step(t){const k=Math.min((t-t0)/500,1); f.value=from+(PARK-from)*(1-Math.pow(1-k,3)); if(k<1)requestAnimationFrame(step);})(t0);}

function activate(id){
  if(active===id||busy)return; const prev=active,rel=prev>=0?relOf(prev,id):null;
  if(!rel){ if(prev>=0){pauseTrack();stopStream(prev);} active=id;startStream(id);return; }
  busy=true;active=id; flashTie(prev,id); cap.innerHTML=rel.cap+`<small>${rel.sub}</small>`;
  overlay.classList.add("show"); pauseTrack();stopStream(prev);
  if(rel.type==="scratch"){ vinyl.classList.add("spin");padbox.classList.remove("show");playScratch();
    setTimeout(()=>startStream(id),1100); setTimeout(()=>{overlay.classList.remove("show");vinyl.classList.remove("spin");busy=false;},2100);
  } else { padbox.classList.add("show");vinyl.classList.remove("spin");playPads(CHANNELS[id].color);
    setTimeout(()=>startStream(id),750); setTimeout(()=>{overlay.classList.remove("show");padbox.classList.remove("show");busy=false;},1900); } }

faders.forEach(f=>f.addEventListener("input",e=>{ if(busy)return; ensureAudio();
  const id=+e.target.dataset.id, v=parseFloat(e.target.value), s=CHANNELS[id];
  if(id===active){ if(v<=PARK+0.5){ pauseTrack();stopStream(id,false);active=-1; dot.classList.remove("on"); clearNodes();
      segmeta.textContent="";specpos.textContent="";trackline.textContent=""; segblurb.innerHTML='<p class="mut">推子归零,这条流下台了。点或推任意一条继续。</p>'; }
    else if(s.type==="spectrum"){ const idx=specIndex(s,v); if(idx!==curPoint[id]){ curPoint[id]=idx; updateOnAir(id,idx); loadAndPlay(s.points[idx].id); } } }
  else if(v>THRESHOLD) activate(id); }));

showOpening();
</script>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
