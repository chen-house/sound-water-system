<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第二段 · 平行水文调音台 · v5(冷淡纸基调 + 异形推子 + 轻透视)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
  :root {
    --bg: #B6B4AB; --panel: #C3C1B7; --strip: #ABA99E; --stripedge: #9A9788;
    --line: #A09E92; --ink: #2B2924; --dim: #6E6B61; --paper: #CAC8BE;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(120% 80% at 50% 8%, #C6C4BB 0%, var(--bg) 46%, #ABA99F 100%);
    color: var(--ink);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding-bottom: 30px;
  }

  /* ======= 屏幕:ON AIR 面板(正视,保可读) ======= */
  #onair {
    width: 100%; max-width: 980px; background: var(--panel);
    border: 1px solid var(--line); border-top: none; border-radius: 0 0 12px 12px;
    padding: 18px 26px 20px; display: flex; gap: 24px; align-items: flex-start;
    min-height: 210px; box-shadow: 0 6px 22px rgba(60,58,50,.14);
  }
  #nowinfo { flex: 1; min-width: 0; }
  #segtitle { font-size: 15px; margin-bottom: 4px; display: flex; align-items: center; gap: 9px; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #8F8C81;
    flex-shrink: 0; transition: background .4s, box-shadow .4s; }
  #dot.on { background: #3F9E4E; box-shadow: 0 0 8px rgba(63,158,78,.6); }
  #segmeta { font-size: 10.5px; color: var(--dim); margin-bottom: 10px; letter-spacing: .04em; }
  #segblurb { font-size: 12px; color: var(--ink); line-height: 1.95; }
  #segblurb p + p { margin-top: 9px; }
  #segblurb .mut { color: var(--dim); }
  #embedcol { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
  #embed {
    width: 100%; min-height: 80px; border: 1px dashed var(--line); border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--dim); text-align: center; line-height: 1.8; overflow: hidden;
  }
  #embed.live { border: none; }
  #embed iframe { border-radius: 12px; display: block; }
  #trackline { font-size: 9.5px; color: var(--dim); line-height: 1.7; text-align: right; }

  /* ======= 台面:轻透视(往前躺) ======= */
  #stage { width: 100%; max-width: 1000px; margin-top: 40px;
    perspective: 1100px; perspective-origin: 50% 20%; }
  #ground {
    position: relative; width: 100%;
    background: linear-gradient(180deg, transparent, rgba(90,88,78,.10) 55%, rgba(90,88,78,.20));
    border-radius: 14px; padding: 10px 10px 0;
  }
  #deskwrap { overflow-x: auto; overflow-y: visible; padding: 0 12px 4px; }
  .desk {
    display: flex; gap: 9px; justify-content: center; align-items: flex-end;
    min-width: max-content; margin: 0 auto;
    transform: rotateX(11deg); transform-origin: 50% 100%;
  }
  .strip {
    background: linear-gradient(180deg, var(--strip), var(--stripedge));
    border: 1px solid var(--line); border-bottom: none; border-radius: 7px 7px 0 0;
    padding: 9px 6px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    transition: box-shadow .4s, border-color .4s;
    box-shadow: 0 2px 5px rgba(60,58,50,.10);
  }
  .strip.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 4px 12px rgba(60,58,50,.18); }
  .chno { font-size: 7.5px; color: var(--dim); letter-spacing: .1em; }
  .tag { font-size: 8.5px; padding: 3px 3px; border-radius: 3px; color: #fff;
    width: 100%; text-align: center; background: var(--accent);
    opacity: .5; transition: opacity .4s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 1px rgba(0,0,0,.25); }
  .strip.active .tag { opacity: 1; }
  .year { font-size: 8px; color: var(--dim); }
  .fadwrap { display: flex; gap: 5px; align-items: center; }
  input[type=range] { writing-mode: vertical-lr; direction: rtl; width: 20px;
    accent-color: var(--accent); cursor: pointer; }
  .vu { width: 5px; background: rgba(60,58,50,.28); border-radius: 2px; position: relative; overflow: hidden; }
  .vu i { position: absolute; bottom: 0; left: 0; right: 0; height: 0%;
    background: var(--accent); border-radius: 2px; transition: height .09s linear; }
  .wt { font-size: 7px; color: var(--dim); letter-spacing: .08em; opacity: .8; }

  #bench {
    width: 100%; max-width: 1000px; margin-top: 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; text-align: center; box-shadow: 0 3px 12px rgba(60,58,50,.12);
  }
  button { background: var(--paper); border: 1px solid var(--line); color: var(--ink);
    font: inherit; font-size: 12px; padding: 8px 22px; border-radius: 6px;
    cursor: pointer; letter-spacing: .08em; transition: .2s; }
  button:hover { background: #D6D4CA; }
  button.on { border-color: #b8532e; color: #b8532e; background: #E6D9CF; }
  .hint { font-size: 10px; color: var(--dim); margin-top: 9px; line-height: 1.7; }

  /* ======= 过渡覆盖层 ======= */
  #overlay { position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 18px;
    background: rgba(40,39,34,.55); backdrop-filter: blur(2px); z-index: 10; }
  #overlay.show { display: flex; }
  .caption { font-size: 12.5px; color: #F0EEE4; max-width: 460px; text-align: center;
    line-height: 1.9; padding: 0 20px; }
  .caption small { color: #C9C6BB; display: block; margin-top: 6px; font-size: 10px; line-height: 1.8; }
  #vinyl { width: 130px; height: 130px; border-radius: 50%; display: none;
    background: radial-gradient(circle at 50% 50%, #E4E1D6 0 12%, #2a2925 12.5% 13%, transparent 13%),
      repeating-radial-gradient(circle at 50% 50%, #26251f 0 3px, #34322b 3px 6px);
    border: 1px solid #55524a; position: relative; }
  #vinyl::after { content:""; position: absolute; top: 6px; left: 50%; width: 2px; height: 26px;
    background: #E4E1D6; transform-origin: bottom; opacity: .7; }
  #vinyl.spin { display: block; animation: brake 1.6s cubic-bezier(.2,.8,.4,1) forwards; }
  @keyframes brake { 0%{transform:rotate(0turn)} 55%{transform:rotate(1.6turn)}
    75%{transform:rotate(1.45turn)} 88%{transform:rotate(1.75turn)} 100%{transform:rotate(2turn)} }
  #padbox { display: none; gap: 10px; }
  #padbox.show { display: flex; }
  .pad { width: 56px; height: 56px; border-radius: 8px; background: #4a4840; border: 1px solid #5c5a50; }
  .pad.hit { animation: padflash .18s ease-out; }
  @keyframes padflash { 0%{background:var(--flash,#7ea87e);box-shadow:0 0 22px var(--flash,#7ea87e)} 100%{background:#4a4840} }

  @media (max-width: 760px) {
    #onair { flex-direction: column; gap: 14px; }
    #embedcol { width: 100%; }
    #trackline { text-align: left; }
    .desk { justify-content: flex-start; transform: rotateX(7deg); }
  }
</style>
</head>
<body>

  <div id="onair">
    <div id="nowinfo">
      <div id="segtitle"><span id="dot" title="播放状态"></span><span id="segtxt">平行水文 · 1976—2026</span></div>
      <div id="segmeta">十条推子 · 十条还活着的支流</div>
      <div id="segblurb"></div>
    </div>
    <div id="embedcol">
      <div id="embed">Spotify embed<br>(POWER 之后随当前流切换)</div>

  <div id="stage"><div id="ground"><div id="deskwrap"><div class="desk" id="desk"></div></div></div></div>

  <div id="bench">
    <button id="power">POWER</button>
    <div class="hint">推子按支流份量分大小:主干宽高,小众窄矮。fader = 触发器,推过阈值即上台。<br>有血缘的两条流之间,过渡自己演出来。</div>

  <div id="overlay">
    <div id="vinyl"></div>

  <!-- v5 拍板便签(不上屏,详见 STATUS_LOG 2026-07-14 / decision_log_ep2 / ep2_mixer_content):
    精选10条=砍SMOOTH+NEO-TRAD,加LATIN(Afro-Cuban)+JAM(Snarky)。house并入NU JAZZ。
    JAPAN默认Asayake(alt Nujabes);LATIN默认Irakere(alt Chucho);JAM默认Lingus(alt Shofukan)——alt ID在配置。
    LATIN/JAM 暂无交集过渡仪式(待补事实:Irakere=古巴fusion可连FUSION;Snarky=fusion现场延续)。
    结尾落款/ECM点破未定。VU为视觉演出。配色:冷淡纸基调+高饱和跳色;台面轻透视11°。 -->

<script>
/* ================= 内容配置 ================= */
const OPENING = [
  "上一段我们停在 1969,Miles 把电吉他搬进了棚子。",
  "这一段不太一样。1976 年往后,爵士不再一段接一段往前走——它分了岔,好几条一起流。",
  "所以这次不给你唱针了。给你一张调音台:每条推子是一条还活着的支流。推子有大有小——用得多的流大,小众的流小。推哪条,听哪条。",
  "有些推子之间有血缘。碰上了,你会知道的。"
];
const CLOSING = [
  "推子都亮过一遍了。",
  "上一段的故事是接力——每一代把上一代拍在沙滩上。这一段没有谁取代谁:1977 年的〈Birdland〉和 2023 年的伦敦舞池,今晚同时在播。",
  "所以这台调音台不关机。你走之后,它们还各自流各自的。"
];

/* size: XL/L/M/S → 宽 w、推子高 fh */
const SIZE = { XL:{w:112,fh:178}, L:{w:94,fh:150}, M:{w:80,fh:124}, S:{w:66,fh:100} };

const CHANNELS = [
  { ch:"CH 1", tag:"FUSION", year:"1976—", color:"#E98C01", size:"XL",
    track:{ label:"Weather Report —〈Birdland〉· 1977", id:"19vVghIuHm3IAfN4xpRF3q" },
    paras:[
      "电已经通进来七年了。Miles 开的口子,到 70 年代中变成了一整代乐队:Weather Report、Return to Forever、Herbie Hancock 的 Headhunters。",
      "1977 年,Weather Report 录了一首〈Birdland〉。低音不走路了——一个叫 Jaco Pastorius 的人把贝斯上的品丝拆了,让低音开口唱歌。",
      "老派骂这是背叛,年轻人管这叫解放。你听一下再站队。"
    ]},
  { ch:"CH 2", tag:"ECM", year:"1975·全程", color:"#6E93A0", size:"M",
    track:{ label:"Keith Jarrett —《The Köln Concert》Part I · 1975", id:"0f18qaZPd4UdIsryK37vjx" },
    paras:[
      "大西洋另一边,有人在录完全相反的东西。",
      "慕尼黑有个厂牌叫 ECM,老板 Manfred Eicher 信一句话:最美的声音,是仅次于寂静的那种。",
      "1975 年 1 月,科隆歌剧院。Keith Jarrett 背伤发作,几天没睡好,剧院还搬错了钢琴——一台音不准的小排练琴。他差点掉头就走。",
      "他最后还是坐下了,即兴弹了一个多小时。那盘录音叫《The Köln Concert》,后来成了历史上最卖座的爵士独奏专辑。",
      "冷、空、留白。这条支流不陪你,它让你一个人待着。"
    ]},
  { ch:"CH 3", tag:"ACID JAZZ", year:"1980s末—", color:"#E6B23C", size:"S",
    track:{ label:"The Brand New Heavies —〈Never Stop〉· 1991", id:"4kJsd28kYN9n6X87Duf9Zp" },
    paras:[
      "伦敦的 DJ 们把爸妈那辈的 funk、soul、jazz-funk 老唱片翻出来,在俱乐部里放给人跳。一个叫 Gilles Peterson 的 DJ 给这股风起了名字——acid jazz。那是 1987 年,转年他就开了张同名厂牌。",
      "光放唱片不够,有人索性组了活乐队,把这种声音现场重造出来。1991 年前后,The Brand New Heavies 这样的乐队把 acid jazz 顶进了主流:funk 的底、soul 的嗓、jazz 的即兴,台上全是活人。",
      "这条支流不考你耳朵,它让你站起来。爵士重新变成俱乐部里跳的东西。"
    ]},
  { ch:"CH 4", tag:"HIP-HOP", year:"1991—", color:"#1F7A63", size:"XL",
    track:{ label:"A Tribe Called Quest —〈Excursions〉· 1991", id:"4tEaytMs86hIaOSsiGoLcP" },
    paras:[
      "纽约这边,采样机是新乐器。",
      "1991 年,A Tribe Called Quest 出了《The Low End Theory》,还把 bebop 年代的贝斯大师 Ron Carter 请进了棚。低音提琴走在说唱底下。开场曲〈Excursions〉里有一句词,大意是:我爸说,你们这 hip-hop,听着像我年轻时的 bebop。",
      "这句词,就是这条支流的身份证。",
      "二十几年后,主动权回到乐手手里:2015 年,Kendrick Lamar 的《To Pimp a Butterfly》——弹琴的、吹萨克斯的、弹贝斯的,全是爵士出身。一张说唱专辑,同时是一张爵士专辑。"
    ]},
  { ch:"CH 5", tag:"NU JAZZ", year:"1990s末—", color:"#7E5C86", size:"M",
    track:{ label:"St Germain —〈Rose Rouge〉· 2000", id:"1divptdjcWXvF1aflfTQnw" },
    paras:[
      "千禧年前后,有人把爵士直接喂进了采样器和鼓机。",
      "巴黎制作人 Ludovic Navarre,艺名 St Germain。2000 年他在 Blue Note 出了张《Tourist》,开场曲〈Rose Rouge〉:一句 Marlena Shaw 的人声采样打底,钢琴一圈一圈转,house 的鼓在下面走,小号在上面即兴。",
      "演奏和编程,活人和机器,在这张唱片里分不出谁是谁。house 那条线,就藏在这里。",
      "这条支流不请你跳舞,也不考你耳朵——它给你铺一间深夜的房间。"
    ]},
  { ch:"CH 6", tag:"JAPAN", year:"1970s—", color:"#CB5A48", size:"L",
    track:{ label:"Casiopea —〈Asayake〉· 1979", id:"4pOVSSVmz7Y2i4i000UviG",
            alt:{ label:"Nujabes —〈Feather〉· 2005", id:"2ej1A2Ze6P2EOW7KfIosZR" } },
    paras:[
      "这条支流自己养活自己,快五十年了。",
      "东京,1979 年。一支叫 Casiopea 的乐队出道当年连发两张专辑,第二张《Super Flight》里有一首〈Asayake〉(朝焼け)——技术密得像精密仪器,却一点不冷,亮得像它名字里那场日出。",
      "日本人听爵士有多认真?全国开着几百家 jazz 喫茶——不聊天,不社交,坐下来,郑重其事听一张唱片。",
      "这份认真后来转了世:2005 年,东京制作人 Nujabes 把爵士采样揉进碎拍,做出〈Feather〉。今天全世界陪人写作业的那种 lofi,家谱里绕不开他。"
    ]},
  { ch:"CH 7", tag:"SPIRITUAL", year:"2010s—", color:"#D6A32E", size:"L",
    track:{ label:"Kamasi Washington —〈Change of the Guard〉· 2015", id:"4xw8UnKYxsiRFjigtQcVAL" },
    paras:[
      "60 年代那种大到近乎宗教的爵士——Coltrane 晚期,Pharoah Sanders——熄了几十年,2015 年在洛杉矶重新点着了。",
      "萨克斯手 Kamasi Washington 一出手就是三张碟:合唱团、弦乐,全编制往上堆。专辑名也不客气,就叫《The Epic》。",
      "这条支流不要“好听”,它要把你抬起来。",
      "2021 年还有一封告别信:电子制作人 Floating Points、80 岁的 Pharoah Sanders、伦敦交响乐团,合录了《Promises》。九个乐章,一口气。转年,老人走了。"
    ]},
  { ch:"CH 8", tag:"UK WAVE", year:"2010s—", color:"#2E9C8E", size:"L",
    track:{ label:"Ezra Collective —〈Victory Dance〉· 2022", id:"6GumLQysBiahvtJmxMXOpn" },
    paras:[
      "最后这条老流之外,最年轻的一条,现在进行时。",
      "伦敦有个青训营叫 Tomorrow's Warriors,专教移民街区的孩子玩爵士。这批孩子长大,把 grime、afrobeat、dub 全焊进了爵士——在俱乐部里,人群跟着萨克斯蹦。",
      "2023 年 9 月,Mercury 奖开奖。拿奖的是支爵士乐队:Ezra Collective,《Where I'm Meant to Be》。这个奖发了三十年,爵士头一回。鼓手 Femi Koleoso 上台第一句:先感谢上帝。",

  { ch:"CH 9", tag:"LATIN", year:"1970s—", color:"#B21E38", size:"L",

            alt:{ label:"Chucho Valdés —〈Mambo Influenciado〉(Piano Solo)· 1988", id:"4olLj9QvlWOHRzLhL1LEMW" } },
    paras:[

      "哈瓦那,1973 年。钢琴手 Chucho Valdés 组了 Irakere——非洲鼓、古巴 son、爵士、摇滚,全焊在一起,音量拉满。〈Bacalao con Pan〉(鳕鱼夹面包)是首拿街头食物命名的舞曲,却密得像一台会跳舞的引擎。",

    track:{ label:"Snarky Puppy —〈Lingus〉· 2014", id:"68d6ZfyMUYURol2y15Ta2Y",
            alt:{ label:"Snarky Puppy —〈Shofukan〉· 2014", id:"1BWsQm7kOBjK2aSFYg5HQZ" } },

/* 交集连线(v5 索引):FUSION0 ECM1 ACID2 HIP3 NU4 JP5 SPIR6 UK7 LAT8 JAM9 */
const REL = {
  "0-3": { type:"scratch", cap:"Herbie Hancock〈Rockit〉· 1983", sub:"一个 fusion 大佬亲手玩搓碟,提前十年预告了这场联姻" },
  "2-3": { type:"pad", cap:"Us3〈Cantaloop (Flip Fantasia)〉· 1993", sub:"一脚踩 acid jazz、一脚踩 hip-hop——采 Herbie 1964〈Cantaloupe Island〉,Blue Note 头一回授权自家唱片被整张采样" },
  "3-5": { type:"pad", cap:"Nujabes · 东京", sub:"爵士采样、碎拍、lofi,三条路在他家门口交汇" },
  "3-6": { type:"pad", cap:"洛杉矶 · Brainfeeder", sub:"Kamasi 的萨克斯吹在《To Pimp a Butterfly》里;《The Epic》出在 Flying Lotus 的厂牌上" },
  "6-7": { type:"scratch", cap:"Shabaka Hutchings", sub:"浪尖上的人,2024 年放下萨克斯,拿起了笛子" },
  "2-7": { type:"scratch", cap:"Gilles Peterson", sub:"80 年代末办 Acid Jazz 厂牌的人,2018 年给伦敦新浪潮升旗:《We Out Here》" },
  "1-4": { type:"scratch", cap:"Nils Petter Molvær《Khmer》· 1997", sub:"一把电子化的小号,从 ECM 漂进了氛围" },
};
const relOf = (a,b) => REL[`${Math.min(a,b)}-${Math.max(a,b)}`] || null;
const THRESHOLD = -30, PARK = -48;

/* ================= Spotify iframe API ================= */
let spCtrl = null, spReady = false, pendingId = null;
window.onSpotifyIframeApiReady = (IFrameAPI) => {
  const box = document.getElementById("embed");
  box.innerHTML = ""; box.classList.add("live");
  const holder = document.createElement("div"); box.appendChild(holder);
  IFrameAPI.createController(holder,
    { uri: `spotify:track:${CHANNELS[0].track.id}`, width: "100%", height: 80 },
    (controller) => { spCtrl = controller; spReady = true;
      if (pendingId) { loadAndPlay(pendingId); pendingId = null; } });
};
function loadAndPlay(id){ if (!spReady) { pendingId = id; return; }
  spCtrl.loadUri(`spotify:track:${id}`); setTimeout(() => spCtrl.play(), 350); }
function pauseTrack(){ if (spReady) spCtrl.pause(); }

/* ================= 过渡音效 ================= */
const scrGain=new Tone.Gain(0).toDestination();
const scrFilter=new Tone.Filter(800,"bandpass");scrFilter.Q.value=6;
const scrNoise=new Tone.Noise("pink");scrNoise.connect(scrFilter);scrFilter.connect(scrGain);
function playScratch(){scrNoise.start();const now=Tone.now(),f=scrFilter.frequency,g=scrGain.gain;
  [[0,.12,400,2600],[.14,.1,2600,500],[.28,.12,500,3000],[.44,.16,3000,300],[.66,.1,300,2200],[.8,.14,2200,600]]
  .forEach(([t,d,a,b])=>{f.setValueAtTime(a,now+t);f.rampTo(b,d,now+t);g.setValueAtTime(.5,now+t);g.rampTo(.05,d,now+t);});
  g.rampTo(0,.2,now+1.0);setTimeout(()=>scrNoise.stop(),1400);}
const padSynth=new Tone.PolySynth(Tone.Synth,{oscillator:{type:"sawtooth"},volume:-8,envelope:{attack:.003,decay:.2,sustain:0,release:.15}}).toDestination();
const padThump=new Tone.MembraneSynth({volume:-4,pitchDecay:.03}).toDestination();
function playPads(color){[["C3","G3"],["D3","A3"],["F3","C4"],["G3","D4"]].forEach((c,i)=>{
  setTimeout(()=>{padThump.triggerAttackRelease("C1","16n");padSynth.triggerAttackRelease(c,"16n");
    const p=document.getElementById("p"+i);p.style.setProperty("--flash",color);
    p.classList.remove("hit");void p.offsetWidth;p.classList.add("hit");},i*160);});}

/* ================= 界面 ================= */
const desk=document.getElementById("desk");
const dot=document.getElementById("dot"), segtxt=document.getElementById("segtxt"),
      segmeta=document.getElementById("segmeta"), segblurb=document.getElementById("segblurb"),
      embed=document.getElementById("embed"), trackline=document.getElementById("trackline");
const overlay=document.getElementById("overlay"),vinyl=document.getElementById("vinyl"),
      padbox=document.getElementById("padbox"),cap=document.getElementById("cap");

const strips=CHANNELS.map((s,idx)=>{const sz=SIZE[s.size];const el=document.createElement("div");
  el.className="strip";el.style.setProperty("--accent",s.color);el.style.width=sz.w+"px";
  el.innerHTML=`<div class="chno">${s.ch}</div><div class="tag">${s.tag}</div><div class="year">${s.year}</div>
    <div class="fadwrap">
      <input type="range" min="${PARK}" max="0" value="${PARK}" step="0.5" data-id="${idx}" style="height:${sz.fh}px">
      <div class="vu" style="height:${sz.fh}px"><i id="vu${idx}"></i></div>
    </div>
    <div class="wt">${s.size}</div>`;
  desk.appendChild(el);return el;});
const faders=[...document.querySelectorAll("input[type=range]")];

let active=-1,powered=false,busy=false;

function renderParas(arr, mut=false){ segblurb.innerHTML = arr.map(p=>`<p${mut?' class="mut"':''}>${p}</p>`).join(""); }
function showOpening(){ dot.classList.remove("on"); segtxt.textContent="平行水文 · 1976—2026";
  segmeta.textContent="十条推子 · 十条还活着的支流"; renderParas(OPENING, true); trackline.textContent=""; }
function showClosing(){ dot.classList.remove("on"); segtxt.textContent="平行水文 · 1976—2026";
  segmeta.textContent=""; renderParas(CLOSING, true); trackline.textContent=""; }
function updateOnAir(id){ const s=CHANNELS[id]; dot.classList.add("on");
  segtxt.textContent=`${s.ch} · ${s.tag}`; segmeta.textContent=s.track.label;
  renderParas(s.paras); trackline.textContent="▶ "+s.track.label; embed.classList.add("live"); }
function stopStream(id,animate=true){ strips[id].classList.remove("active"); if(animate)slideDown(faders[id]); }
function startStream(id){ strips[id].classList.add("active"); updateOnAir(id); loadAndPlay(CHANNELS[id].track.id); }
function slideDown(fader){const from=parseFloat(fader.value),t0=performance.now();
  (function step(t){const k=Math.min((t-t0)/500,1);
    fader.value=from+(PARK-from)*(1-Math.pow(1-k,3));
    if(k<1)requestAnimationFrame(step);})(t0);}

function activate(id){
  if(active===id||busy)return;
  const prev=active,rel=prev>=0?relOf(prev,id):null;
  if(!rel){ if(prev>=0){pauseTrack();stopStream(prev);} active=id;startStream(id);return; }
  busy=true;active=id;
  cap.innerHTML=rel.cap+`<small>${rel.sub}</small>`;
  overlay.classList.add("show"); pauseTrack();stopStream(prev);
  if(rel.type==="scratch"){
    vinyl.classList.add("spin");padbox.classList.remove("show");playScratch();
    setTimeout(()=>startStream(id),1100);
    setTimeout(()=>{overlay.classList.remove("show");vinyl.classList.remove("spin");busy=false;},2100);
  }else{
    padbox.classList.add("show");vinyl.classList.remove("spin");playPads(CHANNELS[id].color);
    setTimeout(()=>startStream(id),750);
    setTimeout(()=>{overlay.classList.remove("show");padbox.classList.remove("show");busy=false;},1900);
  }
}

faders.forEach(f=>f.addEventListener("input",e=>{
  if(!powered||busy)return;
  const id=+e.target.dataset.id,v=parseFloat(e.target.value);
  if(id===active){
    if(v<=PARK+0.5){ pauseTrack();stopStream(id,false);active=-1;
      dot.classList.remove("on"); segmeta.textContent="";trackline.textContent="";
      segblurb.innerHTML='<p class="mut">推子归零,这条流下台了。推任意一条继续。</p>'; }
  } else if(v>THRESHOLD)activate(id);
}));

let vuLevel=0;
(function vu(){ CHANNELS.forEach((_,i)=>{ let h=0;
    if(i===active&&powered){ vuLevel += (Math.random()*90+8-vuLevel)*0.18; h=vuLevel; }
    document.getElementById("vu"+i).style.height=h+"%"; });
  requestAnimationFrame(vu); })();

const btn=document.getElementById("power");
btn.addEventListener("click",async()=>{
  await Tone.start();powered=!powered;
  if(powered){ btn.textContent="OFF AIR?";btn.classList.add("on");
    segblurb.innerHTML='<p class="mut">往上推任意一条推子——越过阈值就上台,屏幕跟着换。</p>';
  } else { if(active>=0){pauseTrack();stopStream(active);active=-1;}
    btn.textContent="POWER";btn.classList.remove("on");showClosing(); }
});

showOpening();
</script>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
