<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星座只是地球的视角</title>
<style>
  :root{
    --sky:#050810;
    --ink:#e9eff7; --ink2:#8fa2b8; --ink3:#4c5d72; --ink4:#2f3d4e;
    --line:#b9c4f0;      /* 人连的线 */
    --orbit:#e5a8b4;     /* 天转的轨道 */
    --gold:#ffd08a;      /* 北斗 */
    --kin:#8fd8c4;       /* 同一位鼓手 */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--sky);color:var(--ink);user-select:none;
    font-family:"PingFang SC","Hiragino Sans GB",ui-sans-serif,system-ui,sans-serif}

  /* ---------- 开场:先听见,再看见 ---------- */
  #gate{position:fixed;inset:0;z-index:100;background:var(--sky);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:opacity 1.6s ease}
  #gate.off{opacity:0;pointer-events:none}
  #gate svg{width:120px;height:120px;overflow:visible}
  @keyframes breathe{
    0%,100%{transform:scale(1);opacity:.55}
    50%{transform:scale(1.5);opacity:1}}
  #gate .g{transform-origin:center;animation:breathe 3.4s ease-in-out infinite}

  /* ---------- 主体 ---------- */
  #app{height:100vh;display:flex;flex-direction:column;padding:14px 24px 16px;gap:6px;
    opacity:0;transition:opacity 1.4s ease .5s}
  #app.on{opacity:1}
  #skywrap{flex:1 1 auto;position:relative;min-height:0}
  svg#sky{width:100%;height:100%;display:block}

  .bgdot{fill:#93a6bb}
  .swal{fill:none;stroke:var(--line);stroke-width:1;stroke-opacity:.10;
    stroke-linejoin:round;stroke-linecap:round}
  .link{fill:none;stroke:var(--line);stroke-width:1.5;stroke-opacity:.55;
    stroke-linecap:round;stroke-linejoin:round}
  .dip{fill:none;stroke:var(--gold);stroke-width:1.7;stroke-opacity:.85;
    stroke-linecap:round;stroke-linejoin:round}
  .orbit{fill:none;stroke:var(--orbit);stroke-width:.8;stroke-opacity:.14}
  .tail{fill:none;stroke:var(--orbit);stroke-width:1.5;stroke-opacity:.6;stroke-linecap:round}
  .kin{pointer-events:none;transition:stroke-opacity .22s}
  .glow{pointer-events:none}
  .star{pointer-events:none;transition:fill-opacity .9s}
  .hit{fill:transparent;cursor:pointer}
  .lab{font-size:9px;fill:var(--ink4);pointer-events:none;opacity:0;
    transition:opacity .3s;font-variant-numeric:tabular-nums}
  .lab.show{opacity:1}

  /* ---------- 调音台 ---------- */
  #deck{flex:0 0 auto;display:flex;align-items:center;gap:20px;
    background:linear-gradient(180deg,#0d1422 0%,#070b14 100%);
    border:1px solid rgba(147,166,187,.11);border-radius:10px;padding:11px 18px 13px}
  #now{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:10px;opacity:.55;
    transition:opacity .4s}
  #now.on{opacity:1}
  #now .t{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #now .s{font-size:10.5px;color:var(--ink3);white-space:nowrap}
  #bar{flex:0 0 132px;height:2px;background:rgba(147,166,187,.16);border-radius:2px;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:2px}
  #modes{display:flex;flex:0 0 auto}
  #modes button{background:none;border:none;color:var(--ink3);cursor:pointer;font-family:inherit;
    font-size:11.5px;letter-spacing:.12em;padding:5px 14px;transition:color .25s;
    border-left:1px solid rgba(147,166,187,.11)}
  #modes button:first-child{border-left:none}
  #modes button.on{color:var(--gold);font-weight:700}
  /* 七颗的进度:不写字,只有七个点 */
  #seven{flex:0 0 auto;display:flex;gap:5px;align-items:center}
  #seven i{width:4px;height:4px;border-radius:50%;background:var(--ink4);transition:background .6s,box-shadow .6s}
  #seven i.on{background:var(--gold);box-shadow:0 0 6px rgba(255,208,138,.8)}

  /* ---------- 信息卡 ---------- */
  #info{position:absolute;pointer-events:none;z-index:20;opacity:0;transition:opacity .16s;
    background:rgba(6,10,20,.95);border:1px solid rgba(147,166,187,.18);border-radius:8px;
    padding:10px 13px;max-width:284px;backdrop-filter:blur(8px)}
  #info.show{opacity:1}
  #info .y{font-size:10px;color:var(--gold);letter-spacing:.12em;font-weight:700}
  #info .a{font-size:13px;margin:3px 0 1px;line-height:1.35}
  #info .b{font-size:11px;color:var(--ink2)}
  #info .c{font-size:10.5px;color:var(--ink3);margin-top:7px;padding-top:7px;line-height:1.65;
    border-top:1px solid rgba(147,166,187,.12)}
  #info .c em{font-style:normal;color:var(--kin)}
  #info .q{font-size:10.5px;color:var(--ink2);margin-top:6px;line-height:1.7;font-style:italic}
  #info .x{color:#e0a97e}
</style>
</head>

  <svg viewBox="-60 -60 120 120"><g class="g">
    <circle r="26" fill="#cfe6f5" fill-opacity=".10"/>

  </g></svg>

  </div>
  <div id="deck">

    <div id="bar"><i></i></div>
    <div id="seven"></div>
    <div id="modes">
      <button data-m="0" class="on">燕</button>
      <button data-m="1">鼓手</button>
      <button data-m="2">星轨</button>

</div>

 tr:"Calvary",q:"时而遮蔽节拍,时而加一条对位线,时而是走走停停的打击乐表层。 — All About Jazz"},
{y:2024,al:"Breaking Stretch",ar:"Patricia Brennan",p:[796,249],g:"vib",lit:2,
 dr:[["Marcus Gilmore",1986],["Mauricio Herrera",null,null,"打击乐"]],
 u:P+"AudioPreview221/v4/f4/94/34/f49434e4-812d-3b55-fbcb-2cf04c26a45d/mzaf_15770357953061205629.plus.aac.p.m4a",
 tr:"Five Suns",q:"把时间组合拆开,织出一张 clave 网,立刻把你吸进去。 — DownBeat"},
{y:2025,al:"About Ghosts",ar:"Mary Halvorson",p:[205,130],g:"gtr",lit:1,
 dr:[["Tomas Fujiwara",1977]],
 u:P+"AudioPreview211/v4/8d/77/ab/8d77ab59-bb55-d76d-06c7-9bf5986f17da/mzaf_1721883823067216759.plus.aac.p.m4a",
 tr:"Carved From"},
];
const OPEN=2021;                       /* 开场那一首 */
const DIP=[2022,2012,2007,2021,2013,2018,2006];   /* 北斗:开口折线,勺子不封口 */

/* 共享鼓手索引 —— 数据自己算 */
const DRUM={}; S.forEach(d=>d.dr.forEach(([n])=>{(DRUM[n]=DRUM[n]||[]).push(d.y)}));
const KIN=[]; Object.values(DRUM).forEach(ys=>{
  if(ys.length>1) for(let i=1;i<ys.length;i++) KIN.push([ys[i-1],ys[i]]);
});

const SWALLOW=[
 [2023,2006,2021,2011,2013,2018,2008,2023],   /* 躯干 */
 [2011,2014],[2011,2015],                      /* 尾叉 */
 [2021,2016],                                  /* 接肩 */
 [2016,2007,2019,2012,2017,2022,2025,2010,2009,2020,2016]  /* 翅膀 */
];
const MODE={0:SWALLOW,1:KIN.map(e=>[e[0],e[1]]),2:[]};

const NS="http://www.w3.org/2000/svg";
const E=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
const $=i=>document.getElementById(i);
const F=y=>S.find(s=>s.y===y);
const R=d=>({3:8.2,2:5.6,1:3.8})[d.lit];
function sp(cx,cy,r){const w=r*.20,q=r*.30;
 return `M${cx} ${cy-r}C${cx+w} ${cy-q} ${cx+q} ${cy-w} ${cx+r} ${cy}`
  +`C${cx+q} ${cy+w} ${cx+w} ${cy+q} ${cx} ${cy+r}`
  +`C${cx-w} ${cy+q} ${cx-q} ${cy+w} ${cx-r} ${cy}`
  +`C${cx-q} ${cy-w} ${cx-w} ${cy-q} ${cx} ${cy-r}Z`}

/* ── 背景 ── */
(()=>{let s=20260731;const rn=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff};
 const g=$("g-bg"); BG=[];
 for(let i=0;i<340;i++){const c=E("circle",{class:"bgdot",cx:(rn()*1000).toFixed(1),
   cy:(rn()*560).toFixed(1),r:(.3+rn()*.75).toFixed(2)});
   c._o=.07+rn()*.24; c.setAttribute("fill-opacity",c._o); g.appendChild(c); BG.push(c);}})();
var BG;

/* ── 燕的常驻淡轮廓 ── */
SWALLOW.forEach(ch=>$("g-swal").appendChild(E("path",{class:"swal",
  d:ch.map((y,i)=>(i?"L":"M")+F(y).p[0]+" "+F(y).p[1]).join(" ")})));

/* ── 画星 ── */
const gS=$("g-star");
S.forEach(d=>{
  const [x,y]=d.p, r=R(d);
  d._r=r; d._heard=false;
  d._g=E("circle",{class:"glow",cx:x,cy:y,r:r*1.9,fill:"#dceaf7","fill-opacity":.04});
  d._s=E("path",{class:"star",d:sp(x,y,r),fill:"#fff","fill-opacity":.20});
  d._k=E("circle",{class:"kin",cx:x,cy:y,r:r*2.5,fill:"none",stroke:"var(--kin)",
    "stroke-width":1,"stroke-opacity":0});
  gS.appendChild(d._g);gS.appendChild(d._s);gS.appendChild(d._k);
  d._l=E("text",{class:"lab",x:x+r+5,y:y+3.5});d._l.textContent=d.y;$("g-lab").appendChild(d._l);
  const h=E("circle",{class:"hit",cx:x,cy:y,r:Math.max(17,r*2.4)});
  h.onmouseenter=e=>show(d,e); h.onmousemove=mv; h.onmouseleave=hide;
  h.onclick=()=>play(d);
  $("g-hit").appendChild(h);
});

/* ── 七个点 ── */
DIP.forEach(()=>$("seven").appendChild(document.createElement("i")));
function sevenUp(){
  const n=DIP.filter(y=>F(y)._heard).length;
  [...$("seven").children].forEach((e,i)=>e.classList.toggle("on",i<n));
  if(n===DIP.length) drawDipper();
}

/* ── 信息卡 ── */
function show(d,e){
  const dr=d.dr.map(([n,b,dd,t])=>{
    const life=b?` ${b}${dd?"–"+dd:""}`:"";
    const also=(DRUM[n]||[]).filter(v=>v!==d.y);
    return n+life+(t?" · "+t:"")+(also.length?` <em>· ${also.join(" / ")}</em>`:"");
  }).join("<br>");
  $("info").innerHTML=`<div class="y">${d.y}${d.dip?" · "+d.dip:""}</div>
   <div class="a">${d.al}</div><div class="b">${d.ar}</div>
   <div class="c">${dr}${d.u?"":'<br><span class="x">✕ '+d.x+'</span>'}</div>
   ${d.q?'<div class="q">'+d.q+'</div>':""}`;
  $("info").classList.add("show");
  const mine=new Set(d.dr.map(v=>v[0]));
  S.forEach(o=>o._k.setAttribute("stroke-opacity",(o!==d&&o.dr.some(v=>mine.has(v[0])))?.7:0));
  mv(e);
}
function mv(e){const i=$("info"),w=$("skywrap").getBoundingClientRect();
 let x=e.clientX-w.left+16,y=e.clientY-w.top+14;
 if(x+296>w.width)x=e.clientX-w.left-302; if(y+150>w.height)y=e.clientY-w.top-156;
 i.style.left=x+"px";i.style.top=y+"px"}
function hide(){$("info").classList.remove("show");
 S.forEach(o=>o._k.setAttribute("stroke-opacity",0))}

/* ═══════════ 声音 + 脉动 ═══════════ */
const au=$("au"); let AC,AN,BUF,analysable=false,cur=null,corsTried=false;
au.addEventListener("timeupdate",()=>{
  if(!cur)return;
  const pct=au.duration?au.currentTime/au.duration:0;
  document.querySelector("#bar i").style.width=(pct*100)+"%";
  if(!cur._heard&&au.currentTime>4){cur._heard=true;lightUp(cur);sevenUp();}
});
au.addEventListener("ended",()=>{document.querySelector("#bar i").style.width="0%";
  $("now").classList.remove("on");cur=null});

function lightUp(d){d._s.setAttribute("fill-opacity",1);d._g.setAttribute("fill-opacity",.16)}

function initAnalyser(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const src=AC.createMediaElementSource(au);
    AN=AC.createAnalyser(); AN.fftSize=256; AN.smoothingTimeConstant=.55;
    src.connect(AN); AN.connect(AC.destination);
    BUF=new Uint8Array(AN.frequencyBinCount); analysable=true;
  }catch(err){analysable=false}
}

function play(d){
  if(!d.u)return;
  cur=d;
  $("now").classList.add("on");
  document.querySelector("#now .t").textContent=d.tr+" — "+d.ar;
  document.querySelector("#now .s").textContent=d.y;
  if(!corsTried){corsTried=true;au.crossOrigin="anonymous"}
  au.src=d.u;
  au.play().then(()=>{initAnalyser();if(AC&&AC.state==="suspended")AC.resume()})
   .catch(()=>{ /* CORS 拦了音频:去掉 crossOrigin 重来,脉动退回合成 */
      au.removeAttribute("crossorigin"); analysable=false;
      au.src=d.u; au.play().catch(()=>{});
   });
}

/* 脉动:优先真实鼓点包络;拿不到就合成呼吸 */
let t0=performance.now();
function pulse(){
  requestAnimationFrame(pulse);
  let e=0;
  if(cur&&!au.paused){
    if(analysable&&AN){
      AN.getByteFrequencyData(BUF);
      let s=0;for(let i=0;i<8;i++)s+=BUF[i];       /* 低频 = 底鼓/军鼓体 */
      e=Math.min(1,Math.max(0,(s/8-96)/110));
    }else{
      e=.5+.5*Math.sin((performance.now()-t0)/1000*Math.PI*2*(112/60));
      e*=.55;
    }
  }
  if(cur){
    const r=cur._r*(1+e*.85);
    cur._s.setAttribute("d",sp(cur.p[0],cur.p[1],r));
    cur._g.setAttribute("r",r*1.9);
    cur._g.setAttribute("fill-opacity",.16+e*.34);
  }
  const g=e*.5;
  for(let i=0;i<BG.length;i++)BG[i].setAttribute("fill-opacity",(BG[i]._o*(1+g)).toFixed(3));
}
pulse();

/* ═══════════ 连线 ═══════════ */
const gL=$("g-link"),gO=$("g-orbit"),gT=$("g-tail"),gD=$("g-dip");
let mode=-1,busy=0;

function chains(m){
  gL.innerHTML="";
  MODE[m].forEach((ch,i)=>{
    const p=E("path",{class:"link",d:ch.map((y,j)=>(j?"L":"M")+F(y).p[0]+" "+F(y).p[1]).join(" ")});
    gL.appendChild(p);
    const L=p.getTotalLength();
    p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
    p.style.transition=`stroke-dashoffset .7s cubic-bezier(.4,0,.25,1) ${i*70}ms`;
    requestAnimationFrame(()=>p.style.strokeDashoffset=0);
  });
}
function retract(cb){
  const ps=[...gL.querySelectorAll("path")];if(!ps.length)return cb();
  ps.forEach((p,i)=>{p.style.transition=`stroke-dashoffset .3s ease-in ${i*30}ms`;
    p.style.strokeDashoffset=p.getTotalLength()});
  setTimeout(cb,310+ps.length*30);
}
/* 星轨:倾斜同心椭圆 */
const OC=[505,318],TH=-16*Math.PI/180,K=.40,ct=Math.cos(TH),st=Math.sin(TH);
function ring(p){const dx=p[0]-OC[0],dy=p[1]-OC[1];
  const u=dx*ct+dy*st,v=(-dx*st+dy*ct)/K;return{a:Math.hypot(u,v),phi:Math.atan2(v,u)}}
function on(a,phi){const lx=a*Math.cos(phi),ly=a*K*Math.sin(phi);
  return[OC[0]+lx*ct-ly*st,OC[1]+lx*st+ly*ct]}
function orbits(go){
  gO.innerHTML="";gT.innerHTML="";if(!go)return;
  const dg=(TH*180/Math.PI).toFixed(2);
  S.forEach((d,i)=>{
    const{a,phi}=ring(d.p);
    const el=E("ellipse",{class:"orbit",cx:OC[0],cy:OC[1],rx:a.toFixed(1),ry:(a*K).toFixed(1),
      transform:`rotate(${dg} ${OC[0]} ${OC[1]})`});
    gO.appendChild(el);el.style.opacity=0;el.style.transition=`opacity .7s ${i*24}ms`;
    requestAnimationFrame(()=>el.style.opacity=1);
    const sw=(2026-d.y)*2.7*Math.PI/180, q=on(a,phi-sw);
    const t=E("path",{class:"tail",d:`M${q[0].toFixed(1)} ${q[1].toFixed(1)} A${a.toFixed(1)} ${(a*K).toFixed(1)} ${dg} 0 1 ${d.p[0]} ${d.p[1]}`});
    gT.appendChild(t);const L=t.getTotalLength();
    t.style.strokeDasharray=L;t.style.strokeDashoffset=L;
    t.style.transition=`stroke-dashoffset .9s cubic-bezier(.3,0,.3,1) ${i*30}ms`;
    requestAnimationFrame(()=>t.style.strokeDashoffset=0);
  });
}
/* 北斗:听完七颗才连 */
let dipDrawn=false;
function drawDipper(){
  if(dipDrawn)return;dipDrawn=true;
  const p=E("path",{class:"dip",d:DIP.map((y,i)=>(i?"L":"M")+F(y).p[0]+" "+F(y).p[1]).join(" ")});
  gD.appendChild(p);
  const L=p.getTotalLength();
  p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
  p.style.transition="stroke-dashoffset 2.4s cubic-bezier(.35,0,.2,1)";
  requestAnimationFrame(()=>p.style.strokeDashoffset=0);
  DIP.forEach(y=>{const d=F(y);d._g.setAttribute("fill",'#ffd08a');d._g.setAttribute("fill-opacity",.24)});
}

function setMode(m,now){
  if(busy||m===mode)return;busy=1;mode=m;
  document.querySelectorAll("#modes button").forEach(b=>b.classList.toggle("on",+b.dataset.m===m));
  S.forEach(d=>d._l.classList.toggle("show",m!==0));
  const paint=()=>{orbits(m===2);if(m!==2)chains(m);busy=0};
  if(now)paint();else{gO.innerHTML="";gT.innerHTML="";retract(paint)}
}
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>setMode(+b.dataset.m));
onkeydown=e=>{if(e.key==="ArrowRight")setMode(Math.min(2,mode+1));
              if(e.key==="ArrowLeft")setMode(Math.max(0,mode-1))};

/* ═══════════ 开场:先听见,再看见 ═══════════ */
$("gate").onclick=()=>{
  play(F(OPEN));
  $("gate").classList.add("off");
  setTimeout(()=>{$("app").classList.add("on");setMode(0,1)},450);
};
</script>
</body>
