<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第二段 · 平行水文 · v11(暖色坐标星空背景 + 底部调音台)</title>
<style>
  :root { --paper:#F0EADC; --ink:#3A3629; --line:#4A4534; --grid:#B7AF9B; --terra:#C25A2E; --dim:#8A8474; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--paper); color:var(--ink);
    font-family:Georgia,"Songti SC","Times New Roman",serif; height:100vh; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; }

  /* ===== 上部:暖色坐标星空(镜头聚焦),作调音台上方的等宽背景块 ===== */
  #topstage { position:relative; width:100%; max-width:1000px; flex:1 1 auto; min-height:0; margin-top:12px;
    border-radius:14px; overflow:hidden;
    background:radial-gradient(120% 120% at 50% 40%, #F3ECDB 0%, #E7DDC8 52%, #D3C7AD 100%);
    box-shadow:inset 0 0 90px rgba(120,110,86,.18); }
  #starfield { position:absolute; inset:0; width:100%; height:100%; z-index:0; }
  .dust { fill:#8f8873; }
  .axis-line { stroke:var(--grid); stroke-width:1; opacity:.32; }
  .axis-year { fill:var(--dim); font-size:11px; opacity:.75; }
  .axis-lab { fill:var(--dim); font-size:10px; letter-spacing:.16em; opacity:.55; }
  .tieline { stroke:var(--terra); stroke-width:1; opacity:.22; transition:opacity .3s, stroke-width .3s; }
  .snode { cursor:pointer; }
  .snode .tail { transition:opacity .3s; }
  .snode .glow { transition:opacity .3s; }
  .snode .core { transition:opacity .3s; }
  .snode .nm { font-size:12px; fill:var(--ink); transition:fill .3s, opacity .3s; }
  .snode .yr { font-size:9px; fill:var(--dim); opacity:.8; }
  .snode.dim { opacity:.4; }
  .snode.on .glow { opacity:.5 !important; }
  .snode.on .core { stroke:#fff; stroke-width:1.4; }
  .snode.on .nm { font-weight:700; }

  /* ===== 调音台(俯视,下部,暖纸,与背景等宽)===== */
  #stage { position:relative; width:100%; max-width:1000px; margin:0 auto 22px; z-index:1;
    perspective:1050px; perspective-origin:50% 42%; }
  #glass { transform:rotateX(58deg); transform-origin:50% 100%;
    background:linear-gradient(158deg, rgba(240,234,220,.6), rgba(214,206,188,.4));
    border:1px solid rgba(255,255,255,.55); border-radius:18px; padding:20px 18px 16px;
    display:flex; gap:14px; justify-content:space-between; align-items:flex-end; width:100%;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 26px 54px rgba(74,69,52,.28); }
  .zone { display:flex; flex-direction:column; padding:9px 10px 7px;
    background:rgba(255,255,255,.24); border:1px solid rgba(120,112,92,.22); border-radius:12px; }
  .zone-label { font-size:9px; color:var(--dim); letter-spacing:.14em; margin:0 0 8px 1px; white-space:nowrap; }
  .zone-row { display:flex; gap:8px; justify-content:center; align-items:flex-end; flex:1; }
  .strip { background:rgba(255,255,255,.4); border:1px solid rgba(120,112,92,.28); border-radius:10px;
    padding:7px 5px 9px; display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7); transition:box-shadow .35s, border-color .35s, background .35s; }
  .strip:hover { background:rgba(255,255,255,.55); }
  .strip.active { border-color:var(--accent); background:rgba(255,255,255,.62);
    box-shadow:0 0 0 1px var(--accent), 0 0 22px -3px var(--accent), inset 0 1px 0 rgba(255,255,255,.7); }
  .tag { font-size:8.5px; font-family:ui-monospace,monospace; padding:3px 3px; border-radius:4px; color:#fff; width:100%;
    text-align:center; background:var(--accent); opacity:.62; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transition:opacity .35s, box-shadow .35s; text-shadow:0 1px 1px rgba(0,0,0,.3); }
  .strip.active .tag { opacity:1; box-shadow:0 0 10px -1px var(--accent); }
  .fadwrap { display:flex; gap:4px; align-items:center; }
  input[type=range] { writing-mode:vertical-lr; direction:rtl; width:20px; accent-color:var(--accent); cursor:pointer; }
  .rail { width:7px; border-radius:4px; background:linear-gradient(to top, var(--c0), var(--c1)); box-shadow:inset 0 0 3px rgba(0,0,0,.18); }
</style>
</head>
<body>
  <div id="topstage"><svg id="starfield" preserveAspectRatio="xMidYMid slice"></svg></div>
  <div id="stage"><div id="glass"></div></div>

  <!-- v11:背景=暖色坐标星空(天体=流,诞生年×声音层定位,尾迹=仍在流,星座线=血缘,径向聚焦=镜头感)。
    调音台保留。音频暂屏蔽,点推子/点天体→高亮对应流。播放器/卡片待背景确认后合并。 -->

<script>
const SIZE = { XL:{w:82,fh:116}, L:{w:72,fh:102}, M:{w:62,fh:88}, S:{w:52,fh:74} };
const CHANNELS = [
  { tag:"ECM", zone:0, color:"#6E93A0", size:"M", start:1975, note:"冷、空、留白" },
  { tag:"SPIRITUAL", zone:0, color:"#D6A32E", size:"L", start:2015, note:"大、向上、迷狂" },
  { tag:"LATIN", zone:0, color:"#B21E38", size:"L", start:1973, note:"加勒比的节奏心脏" },
  { tag:"JAM", zone:0, color:"#2F6DB5", size:"M", start:1991, note:"现场为王,groove 管够" },
  { tag:"NEW STD", zone:0, color:"#8A6BB0", size:"L", start:2008, note:"当代原声,作曲驱动" },
  { tag:"FUSION", zone:1, color:"#E98C01", size:"XL", start:1976, note:"jazz 插上了电" },
  { tag:"JAPAN", zone:1, color:"#CB5A48", size:"L", start:1976, note:"自成生态的精密" },
  { tag:"ACID JAZZ", zone:1, color:"#E6B23C", size:"S", start:1987, note:"把 jazz 拉回舞池" },
  { tag:"UK WAVE", zone:1, color:"#2E9C8E", size:"L", start:2016, note:"年轻、跳舞、diaspora" },
  { tag:"HIP-HOP", zone:2, color:"#7ea87e", size:"XL", start:1991, note:"采样台上的 jazz", spectrum:true, cLo:"#5f7a53", cHi:"#a9c98f" },
  { tag:"NU JAZZ", zone:2, color:"#8d7fc7", size:"M", start:1998, note:"喂给机器的 jazz", spectrum:true, cLo:"#8d7fc7", cHi:"#5a6fb0" },
];
const TIES = [
  { a:5, b:9, year:1983, num:1 }, { a:7, b:9, year:1993, num:2 }, { a:0, b:10, year:1997, num:3 },
  { a:6, b:9, year:2005, num:4 }, { a:1, b:9, year:2015, num:5 }, { a:7, b:8, year:2018, num:6 }, { a:1, b:8, year:2024, num:7 },
];
const ZONES = ["原声 · 活人","电声 · 插电乐队","电子 · 采样/编程"];
const SVGNS="http://www.w3.org/2000/svg";
const el=(n,a)=>{ const e=document.createElementNS(SVGNS,n); for(const k in a) e.setAttribute(k,a[k]); return e; };

/* ===== 坐标星空 ===== */
const sf=document.getElementById("starfield");
const VW=1000, VH=600, padL=118, padR=76, Y0=1973, Y1=2026;
sf.setAttribute("viewBox",`0 0 ${VW} ${VH}`);
const xOf=y=>padL+(Math.max(Y0,Math.min(Y1,y))-Y0)/(Y1-Y0)*(VW-padL-padR);
/* 天体坐标:x=诞生年,y=声音层(电子上/电声中/原声下)*/
const YMAP={ "HIP-HOP":150,"NU JAZZ":192, "FUSION":298,"ACID JAZZ":306,"JAPAN":344,"UK WAVE":322,
  "ECM":452,"JAM":452,"LATIN":486,"NEW STD":480,"SPIRITUAL":460 };
const CORE={ XL:7, L:5.5, M:4.5, S:3.5 };
const pos=i=>({x:xOf(CHANNELS[i].start), y:YMAP[CHANNELS[i].tag]});

/* 星尘(纵深)*/
let seed=7; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
for(let i=0;i<95;i++){ sf.appendChild(el("circle",{cx:rnd()*VW, cy:rnd()*VH, r:rnd()*1.3+.3, class:"dust", opacity:(rnd()*.22+.06).toFixed(2)})); }

/* 时间坐标轴(淡)*/
[1976,1986,1996,2006,2016,2026].forEach(yr=>{ const x=xOf(yr);
  sf.appendChild(el("line",{x1:x,y1:34,x2:x,y2:VH-30,class:"axis-line"}));
  sf.appendChild(el("text",{x:x,y:26,"text-anchor":"middle",class:"axis-year"})).textContent=yr; });
/* 声音层坐标标签(左)*/
[["电子",150],["电声",322],["原声",468]].forEach(([t,y])=>sf.appendChild(el("text",{x:16,y:y+4,class:"axis-lab"})).textContent=t);

/* 血缘=星座连线(天体到天体)*/
TIES.forEach(t=>{ const A=pos(t.a),B=pos(t.b);
  sf.appendChild(el("line",{x1:A.x,y1:A.y,x2:B.x,y2:B.y,class:"tieline",id:`tie_${t.a}_${t.b}`})); });

/* 天体 */
const nodes={};
CHANNELS.forEach((s,idx)=>{ const p=pos(idx), r=CORE[s.size], right=p.x>720;
  const g=el("g",{class:"snode",id:"node_"+idx}); g.style.setProperty("--nc",s.color);
  g.appendChild(el("line",{x1:p.x,y1:p.y,x2:xOf(Y1),y2:p.y,class:"tail",stroke:s.color,"stroke-width":Math.max(1,r/3),opacity:.16,"stroke-linecap":"round"}));
  g.appendChild(el("circle",{cx:p.x,cy:p.y,r:r*3.2,class:"glow",fill:s.color,opacity:.13}));
  g.appendChild(el("circle",{cx:p.x,cy:p.y,r:r,class:"core",fill:s.color}));
  const tx=right?p.x-r-8:p.x+r+8, anc=right?"end":"start";
  const nm=el("text",{x:tx,y:p.y-3,"text-anchor":anc,class:"nm",fill:s.color}); nm.textContent=s.tag; g.appendChild(nm);
  const yr=el("text",{x:tx,y:p.y+9,"text-anchor":anc,class:"yr"}); yr.textContent=s.start; g.appendChild(yr);
  g.addEventListener("click",()=>activate(idx)); sf.appendChild(g); nodes[idx]=g; });

/* ===== 调音台 ===== */
const desk=document.getElementById("glass"); const strips=[];
[0,1,2].forEach(z=>{ const zone=document.createElement("div"); zone.className="zone";
  zone.innerHTML=`<div class="zone-label">${ZONES[z]}</div>`;
  const row=document.createElement("div"); row.className="zone-row";
  CHANNELS.forEach((s,idx)=>{ if(s.zone!==z) return; const sz=SIZE[s.size]; const d=document.createElement("div");
    d.className="strip"; d.style.setProperty("--accent",s.color); d.style.width=sz.w+"px";
    let mid;
    if(s.spectrum){ d.style.setProperty("--c0",s.cLo); d.style.setProperty("--c1",s.cHi);
      mid=`<div class="fadwrap"><input type="range" min="-48" max="0" value="-48" step="1" data-id="${idx}" style="height:${sz.fh}px"><div class="rail" style="height:${sz.fh}px"></div></div>`;
    } else { mid=`<div class="fadwrap"><input type="range" min="-48" max="0" value="-48" step="1" data-id="${idx}" style="height:${sz.fh}px"></div>`; }
    d.innerHTML=`<div class="tag">${s.tag}</div>${mid}`;
    d.addEventListener("click",(e)=>{ if(e.target.tagName==="INPUT")return; activate(idx); });
    row.appendChild(d); strips[idx]=d; });
  zone.appendChild(row); desk.appendChild(zone); });
const faders=[...document.querySelectorAll("input[type=range]")];

/* ===== 交互(音频暂屏蔽)===== */
let active=-1;
function tiesOf(id){ return TIES.filter(t=>t.a===id||t.b===id).map(t=>`tie_${t.a}_${t.b}`); }
function activate(id){ if(active===id) return;
  if(active>=0){ strips[active].classList.remove("active"); const of=faders.find(f=>+f.dataset.id===active); if(of)of.value=-48; }
  active=id; strips[id].classList.add("active");
  Object.keys(nodes).forEach(k=>nodes[k].classList.toggle("dim",+k!==id)); nodes[id].classList.add("on");
  document.querySelectorAll(".tieline").forEach(l=>l.style.opacity=".1");
  tiesOf(id).forEach(tid=>{ const l=document.getElementById(tid); if(l){l.style.opacity=".8";l.style.strokeWidth="2";} });
  const f=faders.find(f=>+f.dataset.id===id); if(f&&parseFloat(f.value)<=-46) f.value=-16; }
function clearActive(){ if(active>=0){ strips[active].classList.remove("active"); active=-1; }
  Object.keys(nodes).forEach(k=>{nodes[k].classList.remove("dim","on");});
  document.querySelectorAll(".tieline").forEach(l=>{l.style.opacity="";l.style.strokeWidth="";}); }
faders.forEach(f=>f.addEventListener("input",e=>{ const id=+e.target.dataset.id, v=parseFloat(e.target.value);
  if(id===active){ if(v<=-47){ strips[id].classList.remove("active"); clearActive(); } }
  else if(v>-30) activate(id); }));
</script>
</body>
</html>
