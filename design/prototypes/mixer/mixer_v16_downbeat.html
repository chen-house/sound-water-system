<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星座只是地球的视角</title>
<style>
  :root{--sky:#050810;--ink:#e9eff7;--ink2:#8fa2b8;--ink3:#4c5d72;--ink4:#2d3a4a;
    --line:#b9c4f0;--orbit:#e5a8b4;--gold:#ffd08a}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--sky);color:var(--ink);user-select:none;
    font-family:"PingFang SC","Hiragino Sans GB",ui-sans-serif,system-ui,sans-serif}

  #gate{position:fixed;inset:0;z-index:100;background:var(--sky);display:flex;
    align-items:center;justify-content:center;cursor:pointer;transition:opacity 1.6s ease}
  #gate.off{opacity:0;pointer-events:none}
  #gate svg{width:130px;height:130px;overflow:visible}
  @keyframes br{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.45);opacity:1}}
  #gate .g{transform-origin:center;animation:br 3.4s ease-in-out infinite}

  #app{height:100vh;display:flex;flex-direction:column;padding:14px 24px 16px;gap:6px;
    opacity:0;transition:opacity 1.4s ease .5s}
  #app.on{opacity:1}
  #skywrap{flex:1 1 auto;position:relative;min-height:0}
  svg#sky{width:100%;height:100%;display:block}

  .bgdot{fill:#93a6bb}
  .swal{fill:none;stroke:var(--line);stroke-width:1.4;stroke-opacity:.5;
    stroke-linejoin:round;stroke-linecap:round}
  .kinline{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-opacity:.62}
  .orbit{fill:none;stroke:var(--orbit);stroke-width:.75;stroke-opacity:.13}
  .tail{fill:none;stroke:var(--orbit);stroke-width:1.4;stroke-opacity:.55;stroke-linecap:round}
  .dseg{fill:none;stroke:var(--gold);stroke-linecap:round;stroke-width:1.6;
    stroke-opacity:.13;transition:stroke-opacity 1.1s,stroke-width 1.1s}
  .dseg.on{stroke-opacity:.9;stroke-width:2}
  .glow{pointer-events:none}
  .star{pointer-events:none;transition:fill-opacity .9s}
  .ring{pointer-events:none;fill:none;stroke:var(--gold);stroke-width:1;stroke-opacity:0;
    transition:stroke-opacity .7s}
  .ring.on{stroke-opacity:.55}
  .hit{fill:transparent;cursor:pointer}
  .lab{font-size:9px;fill:var(--ink4);pointer-events:none;opacity:0;transition:opacity .3s;
    font-variant-numeric:tabular-nums}
  .lab.show{opacity:1}

  #deck{flex:0 0 auto;display:flex;align-items:center;gap:18px;
    background:linear-gradient(180deg,#0d1422,#070b14);
    border:1px solid rgba(147,166,187,.11);border-radius:10px;padding:11px 18px 13px}
  #now{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:9px;opacity:.5;
    transition:opacity .4s}
  #now.on{opacity:1}
  #now .t{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #now .s{font-size:10.5px;color:var(--ink3);white-space:nowrap}
  #bar{flex:0 0 120px;height:2px;background:rgba(147,166,187,.15);border-radius:2px;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:var(--gold)}
  #seven{flex:0 0 auto;display:flex;gap:5px;cursor:pointer;padding:6px 2px}
  #seven i{width:4px;height:4px;border-radius:50%;background:var(--ink4);
    transition:background .6s,box-shadow .6s}
  #seven i.on{background:var(--gold);box-shadow:0 0 6px rgba(255,208,138,.85)}
  #modes{display:flex}
  #modes button{background:none;border:none;color:var(--ink3);cursor:pointer;font-family:inherit;
    font-size:11.5px;letter-spacing:.12em;padding:5px 14px;transition:color .25s;
    border-left:1px solid rgba(147,166,187,.11)}
  #modes button:first-child{border-left:none}
  #modes button.on{color:var(--gold);font-weight:700}

  #info{position:absolute;pointer-events:none;z-index:20;opacity:0;transition:opacity .16s;
    background:rgba(6,10,20,.95);border:1px solid rgba(147,166,187,.18);border-radius:8px;
    padding:10px 13px;max-width:290px;backdrop-filter:blur(8px)}
  #info.show{opacity:1}
  #info .y{font-size:10px;color:var(--gold);letter-spacing:.12em;font-weight:700}
  #info .a{font-size:13px;margin:3px 0 1px;line-height:1.35}
  #info .b{font-size:11px;color:var(--ink2)}
  #info .c{font-size:10.5px;color:var(--ink3);margin-top:7px;padding-top:7px;line-height:1.65;
    border-top:1px solid rgba(147,166,187,.12)}
  #info .c em{font-style:normal;color:#8fd8c4}
  #info .q{font-size:10.5px;color:var(--ink2);margin-top:6px;line-height:1.7;font-style:italic}
  #info .x{color:#e0a97e}
</style>
</head>

<div id="gate"><svg viewBox="-65 -65 130 130"><g class="g">

          <stop offset="0%" stop-color="#dceaf7" stop-opacity=".55"/>

          <stop offset="0%" stop-color="#ffd08a" stop-opacity=".6"/>

          <stop offset="65%" stop-color="#ffd08a" stop-opacity=".06"/>
          <stop offset="100%" stop-color="#ffd08a" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g id="g-bg"></g><g id="g-orbit"></g><g id="g-tail"></g>
      <g id="g-swal"></g><g id="g-kin"></g><g id="g-dip"></g>
      <g id="g-star"></g><g id="g-lab"></g><g id="g-hit"></g>
    </svg>
    <div id="info"></div>
  </div>
  <div id="deck">
    <div id="now"><span class="t"></span><span class="s"></span></div>
    <div id="bar"><i></i></div>
    <div id="seven"></div>
    <div id="modes">
      <button data-m="0" class="on">星轨</button>
      <button data-m="1">北斗</button>
      <button data-m="2">鸽</button>
    </div>
  </div>
</div>

    requestAnimationFrame(()=>el.style.opacity=1);
    const sw=(2026-d.pv)*2.7*Math.PI/180,q=pt(a,phi-sw);
    const t=E("path",{class:"tail",d:`M${q[0].toFixed(1)} ${q[1].toFixed(1)} A${a.toFixed(1)} ${(a*K).toFixed(1)} ${dg} 0 1 ${d.p[0]} ${d.p[1]}`});
    $("g-tail").appendChild(t);const L=t.getTotalLength();
    t.style.strokeDasharray=L;t.style.strokeDashoffset=L;
    t.style.transition=`stroke-dashoffset .9s cubic-bezier(.3,0,.3,1) ${i*28}ms`;
    requestAnimationFrame(()=>t.style.strokeDashoffset=0)})}

/* ── 北斗:一开始就淡金,听一颗实一段 ── */
const SEG=[];
for(let i=1;i<DIP.length;i++){
  const A=F(DIP[i-1]).p,B=F(DIP[i]).p;
  const s=E("path",{class:"dseg",d:`M${A[0]} ${A[1]}L${B[0]} ${B[1]}`});
  $("g-dip").appendChild(s);SEG.push({el:s,a:DIP[i-1],b:DIP[i]});
}
DIP.forEach(()=>$("seven").appendChild(document.createElement("i")));
function refreshDip(){
  SEG.forEach(s=>s.el.classList.toggle("on",F(s.a)._heard&&F(s.b)._heard));
  const n=DIP.filter(a=>F(a)._heard).length;
  [...$("seven").children].forEach((e,i)=>e.classList.toggle("on",i<n));
  DIP.forEach(a=>{const d=F(a);if(d._heard)d._ring.classList.add("on")});
}
/* 扫过那七个点 → 天上那七颗闪一下(不写一个字) */
$("seven").onmouseenter=()=>DIP.forEach(a=>F(a)._ring.classList.add("on"));
$("seven").onmouseleave=()=>DIP.forEach(a=>{if(!F(a)._heard)F(a)._ring.classList.remove("on")});

/* ── 信息卡 ── */
function show(d,e){
  const dr=d.dr.map(([n,b,dd,t])=>{
    const life=b?` ${b}${dd?"–"+dd:""}`:"";
    const also=(DRUM[n]||[]).filter(v=>v!==d.al);
    return n+life+(t?" · "+t:"")+(also.length?` <em>· ${also.join(" / ")}</em>`:"")}).join("<br>");
  $("info").innerHTML=`<div class="y">${d.pv} 届${d.dip?" · "+d.dip:""}</div>
   <div class="a">${d.al}</div><div class="b">${d.ar} <span style="color:var(--ink4)">· 发行 ${d.y}</span></div>
   <div class="c">${dr}${d.note?"<br>"+d.note:""}${d.u?"":'<br><span class="x">✕ '+d.x+'</span>'}</div>
   ${d.q?'<div class="q">'+d.q+'</div>':""}`;
  $("info").classList.add("show");
  const mine=new Set(d.dr.map(v=>v[0]));
  S.forEach(o=>{if(o!==d&&o.dr.some(v=>mine.has(v[0])))o._s.setAttribute("fill-opacity",1)});
  mv(e)}
function mv(e){const i=$("info"),w=$("skywrap").getBoundingClientRect();
 let x=e.clientX-w.left+16,y=e.clientY-w.top+14;
 if(x+300>w.width)x=e.clientX-w.left-306;if(y+156>w.height)y=e.clientY-w.top-162;
 i.style.left=x+"px";i.style.top=y+"px"}
function hide(){$("info").classList.remove("show");
 S.forEach(o=>{if(!o._heard)o._s.setAttribute("fill-opacity",.22)})}

/* ── 声音 + 脉动 ── */
const au=$("au");let AC,AN,BUF,able=false,cur=null,tried=false;
au.ontimeupdate=()=>{if(!cur)return;
  document.querySelector("#bar i").style.width=((au.currentTime/(au.duration||30))*100)+"%";
  if(!cur._heard&&au.currentTime>4){cur._heard=true;
    cur._s.setAttribute("fill-opacity",1);refreshDip()}};
au.onended=()=>{document.querySelector("#bar i").style.width="0%";
  $("now").classList.remove("on");cur=null};
function initAN(){if(AC)return;try{
  AC=new(window.AudioContext||window.webkitAudioContext)();
  const s=AC.createMediaElementSource(au);AN=AC.createAnalyser();
  AN.fftSize=256;AN.smoothingTimeConstant=.55;s.connect(AN);AN.connect(AC.destination);
  BUF=new Uint8Array(AN.frequencyBinCount);able=true}catch(e){able=false}}
function play(d){
  if(!d.u)return;cur=d;$("now").classList.add("on");
  document.querySelector("#now .t").textContent=d.tr+" — "+d.ar;
  document.querySelector("#now .s").textContent=d.pv+" 届";
  if(!tried){tried=true;au.crossOrigin="anonymous"}
  au.src=d.u;
  au.play().then(()=>{initAN();if(AC&&AC.state==="suspended")AC.resume()})
   .catch(()=>{au.removeAttribute("crossorigin");able=false;au.src=d.u;au.play().catch(()=>{})})}
const T0=performance.now();
(function pulse(){requestAnimationFrame(pulse);
  let e=0;
  if(cur&&!au.paused){
    if(able&&AN){AN.getByteFrequencyData(BUF);let s=0;for(let i=0;i<8;i++)s+=BUF[i];
      e=Math.min(1,Math.max(0,(s/8-96)/110))}
    else e=(.5+.5*Math.sin((performance.now()-T0)/1000*Math.PI*2*112/60))*.55}
  if(cur){const r=cur._r*(1+e*.8);
    cur._s.setAttribute("d",sp(cur.p[0],cur.p[1],r));
    cur._g.setAttribute("r",r*3.4);cur._g.setAttribute("fill-opacity",.35+e*.5)}
  const g=e*.45;
  for(let i=0;i<BG.length;i++)BG[i].setAttribute("fill-opacity",(BG[i]._o*(1+g)).toFixed(3))})();

/* ── 三视图 ── */
let mode=-1;
function setMode(m){
  if(m===mode)return;mode=m;
  document.querySelectorAll("#modes button").forEach(b=>b.classList.toggle("on",+b.dataset.m===m));
  S.forEach(d=>d._l.classList.toggle("show",m!==1));
  orbits(m===0);swallow(m===2);kin(m===2);
  /* 北斗:星轨与北斗视图里都在;燕里退下 */
  $("g-dip").style.display=(m===2)?"none":"";
  /* 北斗视图:非七颗压暗 */
  S.forEach(d=>{const inD=!!d.dip;
    d._g.setAttribute("fill",inD&&m===1?"url(#gwd)":"url(#gw)");
    d._s.style.opacity=(m===1&&!inD)?.22:1});
}
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>setMode(+b.dataset.m));
onkeydown=e=>{if(e.key==="ArrowRight")setMode(Math.min(2,mode+1));
 if(e.key==="ArrowLeft")setMode(Math.max(0,mode-1))};

/* ── 开场:先听见,再看见 ── */
$("gate").onclick=()=>{play(F(OPEN));$("gate").classList.add("off");
  setTimeout(()=>{$("app").classList.add("on");setMode(0);refreshDip()},450)};
</script>
</body>
