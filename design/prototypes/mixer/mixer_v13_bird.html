    note:"喂给机器的 jazz",
    points:[
      { postag:"house 端", song:"St Germain —〈Rose Rouge〉· 2000", url:"https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview125/v4/0f/77/91/0f77911e-9f82-004c-a80d-7963bf2fddcc/mzaf_7960251369127517046.plus.aac.p.m4a" },
      { postag:"实验端", song:"Jaga Jazzist —〈Airborne〉· 2001", url:"https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview115/v4/93/45/49/934549b9-21e1-98d7-b839-3efa23820ee7/mzaf_15003740329398512266.plus.aac.p.m4a" },
    ]},
];
const idxByTag={}; DATA.forEach((d,i)=>idxByTag[d.tag]=i);
const RSTAR={XL:5.5,L:4,M:3,S:2.4};
/* 鸟形骨架连线(身/翼/尾 + 关节)*/
const SKELETON=[["POST-BOP","SPIRITUAL"],["SPIRITUAL","JAZZ-FUNK"],["JAZZ-FUNK","LATIN"],["LATIN","ECM"],
  ["JAZZ-FUNK","FUSION"],["FUSION","ACID JAZZ"],["ACID JAZZ","JAPAN"],["JAPAN","UK JAZZ"],
  ["ECM","JAZZ RAP"],["JAZZ RAP","NU JAZZ"]];
/* 血缘线两种语义:event=事件(实线,某年某作品) lineage=演化(虚线,基因传承) */
const TIES=[
  { a:"FUSION", b:"JAZZ RAP", type:"event", cap:"Herbie Hancock〈Rockit〉· 1983" },
  { a:"ACID JAZZ", b:"JAZZ RAP", type:"event", cap:"Us3〈Cantaloop〉· 1993" },
  { a:"JAPAN", b:"JAZZ RAP", type:"event", cap:"Nujabes · 东京 · 2005" },
  { a:"SPIRITUAL", b:"JAZZ RAP", type:"event", cap:"洛杉矶 Brainfeeder · 2015" },
  { a:"SPIRITUAL", b:"UK JAZZ", type:"event", cap:"Shabaka Hutchings · 2024" },
  { a:"ACID JAZZ", b:"UK JAZZ", type:"event", cap:"Gilles Peterson《We Out Here》· 2018" },
  { a:"ECM", b:"NU JAZZ", type:"event", cap:"Nils Petter Molvær《Khmer》· 1997" },
  { a:"ACID JAZZ", b:"NU JAZZ", type:"lineage", cap:"近亲 · 舞池基因往电子更深处" },
  { a:"JAPAN", b:"NU JAZZ", type:"lineage", cap:"Kyoto Jazz Massive → 德国 Compost" },
];
const ZONES=["原声 · 活人(鸟身)","电声 · 插电乐队(翼)","电子 · 采样/编程(尾羽)"];
DATA.forEach(d=>d.v=new THREE.Vector3(d.pos[0],d.pos[1],d.pos[2]));
const P=t=>DATA[idxByTag[t]];

/* ===== three 场景 ===== */
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x0b1220,0.0019);
const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,2000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(2,devicePixelRatio));
document.getElementById("scene").appendChild(renderer.domElement);
{ const g=new THREE.SphereGeometry(900,32,32);
  const m=new THREE.ShaderMaterial({side:THREE.BackSide,vertexShader:
   `varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
   fragmentShader:`varying vec3 vP;void main(){float t=clamp((vP.y/900.0)*0.5+0.5,0.0,1.0);
    vec3 top=vec3(0.027,0.043,0.082),mid=vec3(0.043,0.070,0.118),bot=vec3(0.078,0.116,0.161);
    gl_FragColor=vec4(mix(bot,mix(mid,top,smoothstep(0.5,1.0,t)),smoothstep(0.0,1.0,t)),1.0);}`});
  scene.add(new THREE.Mesh(g,m)); }
function radialTex(stops){ const c=document.createElement("canvas");c.width=c.height=128;const x=c.getContext("2d");
  const gr=x.createRadialGradient(64,64,0,64,64,64); stops.forEach(([o,col])=>gr.addColorStop(o,col));
  x.fillStyle=gr;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c); }
/* 柔和衰减:不刺眼也不糊 */
const DTEX=radialTex([[0,"rgba(255,255,255,.9)"],[.3,"rgba(255,255,255,.5)"],[.62,"rgba(255,255,255,.08)"],[1,"rgba(255,255,255,0)"]]);
const GTEX=radialTex([[0,"rgba(255,255,255,.95)"],[.18,"rgba(255,255,255,.6)"],[.45,"rgba(255,255,255,.2)"],[.78,"rgba(255,255,255,.04)"],[1,"rgba(255,255,255,0)"]]);
{ const N=1200,pos=new Float32Array(N*3),col=new Float32Array(N*3);
  for(let i=0;i<N;i++){const r=210+Math.random()*560,th=Math.random()*6.283,ph=Math.acos(Math.random()*2-1);
   pos[i*3]=r*Math.sin(ph)*Math.cos(th);pos[i*3+1]=r*Math.sin(ph)*Math.sin(th)*.7;pos[i*3+2]=r*Math.cos(ph);
   const w=Math.random();col[i*3]=.78+w*.16;col[i*3+1]=.86+w*.1;col[i*3+2]=1.0;}
  const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(pos,3));g.setAttribute("color",new THREE.BufferAttribute(col,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.4,map:DTEX,vertexColors:true,transparent:true,opacity:.8,depthWrite:false,blending:THREE.AdditiveBlending}))); }
function lineBetween(a,b,color,op){ const g=new THREE.BufferGeometry().setFromPoints([P(a).v,P(b).v]);
  return new THREE.Line(g,new THREE.LineBasicMaterial({color,transparent:true,opacity:op})); }
/* 鸟形骨架(冷白细线,看得清)*/
SKELETON.forEach(([a,b])=>scene.add(lineBetween(a,b,0xAFC6E4,.4)));
/* 血缘(赤陶红)*/
TIES.forEach(t=>{ const g=new THREE.BufferGeometry().setFromPoints([P(t.a).v,P(t.b).v]); let l;
  if(t.type==="lineage"){ l=new THREE.Line(g,new THREE.LineDashedMaterial({color:0xE07A45,transparent:true,opacity:.3,dashSize:2.6,gapSize:2.6})); l.computeLineDistances(); }
  else { l=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xE07A45,transparent:true,opacity:.34})); }
  scene.add(l); t._l=l; });
/* 星:柔光晕 + 小亮核 */
DATA.forEach(d=>{ const r=RSTAR[d.size];
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:GTEX,color:new THREE.Color(d.c),transparent:true,opacity:.55,depthWrite:false,blending:THREE.AdditiveBlending}));
  halo.scale.set(r*4.6,r*4.6,1); halo.position.copy(d.v); scene.add(halo);
  const core=new THREE.Sprite(new THREE.SpriteMaterial({map:GTEX,color:0xffffff,transparent:true,opacity:.95,depthWrite:false,blending:THREE.AdditiveBlending}));
  core.scale.set(r*1.7,r*1.7,1); core.position.copy(d.v); scene.add(core);
  d._halo=halo; d._core=core; d._r=r; });

/* 标签 */
const labWrap=document.getElementById("labels");
DATA.forEach(d=>{const e=document.createElement("div");e.className="lab";e.innerHTML=`${d.tag}<div class="yr">${d.yr}</div>`;labWrap.appendChild(e);d._lab=e;});

/* ===== 相机:正对鸟形,拖拽环绕,不自转 ===== */
const target=new THREE.Vector3(-6,-16,0);   /* 视点下移=鸟整体上移,底部给调音台留净空 */
let radius=250,theta=Math.PI/2,phi=1.42;
function applyCam(){cam.position.set(target.x+radius*Math.sin(phi)*Math.cos(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.sin(theta));cam.lookAt(target);}
let drag=false,moved=0,lx=0,ly=0;
const dom=renderer.domElement;
dom.addEventListener("pointerdown",e=>{drag=true;moved=0;lx=e.clientX;ly=e.clientY;});
addEventListener("pointerup",e=>{ if(drag&&moved<6) pickAt(e.clientX,e.clientY); drag=false; });
addEventListener("pointermove",e=>{ if(!drag)return; moved+=Math.abs(e.clientX-lx)+Math.abs(e.clientY-ly);
  theta-=(e.clientX-lx)*.004; phi=Math.max(.3,Math.min(2.6,phi-(e.clientY-ly)*.004)); lx=e.clientX;ly=e.clientY; });
dom.addEventListener("wheel",e=>{e.preventDefault();radius=Math.max(90,Math.min(520,radius+e.deltaY*.25));},{passive:false});
const _v=new THREE.Vector3();
function pickAt(sx,sy){ let best=-1,bd=44;
  DATA.forEach((d,i)=>{ _v.copy(d.v).project(cam); if(_v.z>1)return;
    const x=(_v.x*.5+.5)*innerWidth,y=(-_v.y*.5+.5)*innerHeight,dd=Math.hypot(x-sx,y-sy);
    if(dd<bd){bd=dd;best=i;} });
  if(best>=0) activate(best); }

/* ===== 调音台(表头播放器已在HTML)===== */
const desk=document.getElementById("deckrow"); const strips=[];
const SIZE={XL:{w:74,fh:100},L:{w:64,fh:88},M:{w:56,fh:76},S:{w:48,fh:64}};
[0,1,2].forEach(z=>{ const zone=document.createElement("div");zone.className="zone";
  zone.innerHTML=`<div class="zone-label">${ZONES[z]}</div>`; const row=document.createElement("div");row.className="zone-row";
  DATA.forEach((d,i)=>{ if(d.zone!==z)return; const sz=SIZE[d.size];const el=document.createElement("div");el.className="strip";
    el.style.setProperty("--accent",d.c);el.style.width=sz.w+"px";
    let mid;
    if(d.spectrum){ el.style.setProperty("--c0",d.cLo); el.style.setProperty("--c1",d.cHi); const N=d.points.length;
      const notches=d.points.map((p,k)=>`<span class="notch" id="notch${i}_${k}" style="bottom:${((k+0.5)/N*sz.fh).toFixed(1)}px"></span>`).join("");
      mid=`<div class="fadwrap"><input type="range" min="-48" max="0" value="-48" step="1" data-id="${i}" style="height:${sz.fh}px"><div class="rail" style="height:${sz.fh}px">${notches}</div></div>`;
    } else { mid=`<div class="fadwrap"><input type="range" min="-48" max="0" value="-48" step="1" data-id="${i}" style="height:${sz.fh}px"></div>`; }
    el.innerHTML=`<div class="tag">${d.tag}</div>${mid}`;
    el.addEventListener("click",(e)=>{if(e.target.tagName==="INPUT")return;activate(i);});
    row.appendChild(el);strips[i]=el; });
  zone.appendChild(row);desk.appendChild(zone); });
const faders=[...document.querySelectorAll("input[type=range]")];
const faderById={}; faders.forEach(f=>faderById[+f.dataset.id]=f);

/* ===== 音频 ===== */
const audio=new Audio(); audio.preload="none";
const ICON_PLAY='<svg width="15" height="15" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>';
const ICON_PAUSE='<svg width="13" height="13" viewBox="0 0 14 14"><rect x="2" y="1.5" width="3.4" height="11" fill="currentColor"/><rect x="8.6" y="1.5" width="3.4" height="11" fill="currentColor"/></svg>';
const $=id=>document.getElementById(id);
let playing=false, active=-1; const curPoint={};
$("pbtn").innerHTML=ICON_PLAY;
function setCC(c){ document.documentElement.style.setProperty("--cc",c); }
function fmt(t){if(!isFinite(t))t=0;const m=Math.floor(t/60),s=Math.floor(t%60);return m+":"+String(s).padStart(2,"0");}
function setPlaying(p){playing=p;$("pbtn").innerHTML=p?ICON_PAUSE:ICON_PLAY;}
$("pbtn").onclick=()=>{ if(active<0)return; if(playing){audio.pause();setPlaying(false);} else {audio.play().then(()=>setPlaying(true)).catch(()=>{});} };
audio.ontimeupdate=()=>{const d=audio.duration||30;$("deckfill").style.width=(audio.currentTime/d*100)+"%";$("decktime").textContent=fmt(audio.currentTime)+" / "+fmt(d);};
audio.onended=()=>{setPlaying(false);$("deckfill").style.width="100%";};
$("deckbar").onclick=e=>{if(active<0)return;const r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*(audio.duration||30);};
function playUrl(u){ $("deckfill").style.width="0%"; $("decktime").textContent="0:00 / 0:30";
  audio.src=u; audio.play().then(()=>setPlaying(true)).catch(()=>setPlaying(false)); }
function specIndex(d,v){ const seg=Math.max(0,Math.min(1,(v+30)/30)); return Math.min(d.points.length-1,Math.floor(seg*d.points.length)); }
function setNotches(i,idx){ const d=DATA[i]; if(!d.spectrum)return;
  d.points.forEach((_,k)=>{ const n=$("notch"+i+"_"+k); if(n)n.classList.toggle("on",k===idx); }); }

/* ===== 选中(整体不动,选中星原地放大)===== */
function activate(i){ if(i===active) return; const d=DATA[i];
  if(active>=0){ strips[active].classList.remove("active"); setNotches(active,-1);
    const of=faderById[active]; if(of)of.value=-48; }
  active=i; strips[i].classList.add("active");
  const f=faderById[i]; if(f&&parseFloat(f.value)<=-46) f.value=-16;
  DATA.forEach((s,k)=>{ const on=k===i;
    s._halo.material.opacity=on?.95:.28; s._halo.scale.setScalar(on?s._r*8:s._r*4.6);
    s._core.material.opacity=on?1:.6; s._core.scale.setScalar(on?s._r*2.6:s._r*1.7);
    s._lab.classList.toggle("cur",on);
    s._lab.innerHTML = on ? `${s.tag}<div class="yr">${s.note}</div>` : `${s.tag}<div class="yr">${s.yr}</div>`; });
  TIES.forEach(t=>{ const lit=(t.a===d.tag||t.b===d.tag); t._l.material.opacity=lit?(t.type==="lineage"?.75:.9):.08; });
  setCC(d.c); $("tbtag").textContent=d.tag;
  if(d.spectrum){ const idx=specIndex(d,parseFloat(faderById[i].value)); curPoint[i]=idx; setNotches(i,idx);
    $("tbsong").textContent=d.points[idx].song+" · ◐ "+d.points[idx].postag; playUrl(d.points[idx].url); }
  else { $("tbsong").textContent=d.song; playUrl(d.url); }
}
faders.forEach(f=>f.addEventListener("input",e=>{ const i=+e.target.dataset.id,v=parseFloat(e.target.value),d=DATA[i];
  if(i===active && d.spectrum){ const idx=specIndex(d,v);
    if(idx!==curPoint[i]){ curPoint[i]=idx; setNotches(i,idx);
      $("tbsong").textContent=d.points[idx].song+" · ◐ "+d.points[idx].postag; playUrl(d.points[idx].url); } }
  else if(v>-30 && i!==active) activate(i); }));

/* ===== 标签投影 + 渲染 ===== */
function updateLabels(){ DATA.forEach((d,i)=>{ _v.copy(d.v).project(cam); const vis=_v.z<1,dist=cam.position.distanceTo(d.v);
  d._lab.style.left=((_v.x*.5+.5)*innerWidth)+"px"; d._lab.style.top=((-_v.y*.5+.5)*innerHeight)+"px";
  d._lab.style.opacity=(vis&&(dist<300||i===active))?Math.max(.2,Math.min(1,(320-dist)/150)).toFixed(2):0; }); }
function loop(){ requestAnimationFrame(loop); applyCam(); updateLabels(); renderer.render(scene,cam); }
applyCam(); loop();
addEventListener("resize",()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
