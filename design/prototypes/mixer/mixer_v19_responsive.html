<!DOCTYPE html>
<html lang="zh-CN">

<meta charset="utf-8">
<title>星座只是地球的视角</title>
<style>
  :root{--ink:#e9eff7;--ink2:#8fa2b8;--ink3:#4c5d72;--ink4:#33404f;--gold:#ffd08a}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:#04070f;color:var(--ink);user-select:none;
    font-family:"PingFang SC","Hiragino Sans GB",ui-sans-serif,system-ui,sans-serif}

  #gate{position:fixed;inset:0;z-index:100;background:#04070f;display:flex;
    align-items:center;justify-content:center;cursor:pointer;transition:opacity 1.6s ease}
  #gate.off{opacity:0;pointer-events:none}
  @keyframes br{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.4);opacity:1}}
  #gate g{transform-origin:center;animation:br 3.4s ease-in-out infinite}

  .lnk{fill:none;stroke:#dbe9fb;stroke-opacity:.55;stroke-width:2.3;
    stroke-linecap:round;stroke-dasharray:.1 7}
  .lnk.gold{stroke:var(--gold);stroke-opacity:.9;stroke-width:2.6}
  .lnk.kin{stroke-width:1.6;stroke-opacity:.5;stroke-dasharray:none}
  .orb{fill:none;stroke:#e5a8b4;stroke-opacity:.11;stroke-width:.8}
  .trl{fill:none;stroke:#e5a8b4;stroke-opacity:.5;stroke-width:1.5;stroke-linecap:round}
  .hit{fill:none;pointer-events:all;cursor:pointer}
  .lab{font-size:9.5px;fill:#5d6f85;pointer-events:none;font-variant-numeric:tabular-nums}

  #app{position:fixed;inset:0;opacity:0;transition:opacity 1.4s ease .5s}
  #app.on{opacity:1}
  #skywrap{position:absolute;inset:0}
  svg#sky{width:100%;height:100%;display:block}
  #scrim{position:absolute;left:0;right:0;bottom:0;height:32%;pointer-events:none;
    background:linear-gradient(180deg,rgba(1,3,8,0),rgba(1,3,8,.5) 52%,rgba(1,3,8,.85))}

  /* 控制项浮在天上:无背景、无边框、无容器 */
  #deck{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;
    gap:clamp(12px,2vw,26px);padding:0 clamp(18px,3.2vw,52px) clamp(16px,3vh,34px);
    flex-wrap:wrap}
  #now{flex:1 1 240px;min-width:0;display:flex;align-items:baseline;gap:9px;opacity:.4;
    transition:opacity .4s}
  #now.on{opacity:.92}
  #now .t{font-size:clamp(11px,1vw,13px);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;color:#8fa2b8}
  #now .s{font-size:clamp(9.5px,.85vw,11px);color:#4c5d72}
  #bar{flex:0 0 clamp(70px,8vw,120px);height:1.5px;background:rgba(147,166,187,.13);overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:var(--gold);opacity:.85}
  #seven{flex:0 0 auto;display:flex;gap:5px;cursor:pointer;padding:8px 2px}
  #seven i{width:3.5px;height:3.5px;border-radius:50%;background:#2b3745;
    transition:background .6s,box-shadow .6s}
  #seven i.on{background:var(--gold);box-shadow:0 0 5px rgba(255,208,138,.8)}
  #modes{display:flex;flex:0 0 auto;gap:clamp(10px,1.4vw,22px)}
  #modes button{background:none;border:none;color:#4c5d72;cursor:pointer;font-family:inherit;
    font-size:clamp(10.5px,.95vw,12px);letter-spacing:.14em;padding:6px 0;
    transition:color .25s}
  #modes button:hover{color:#8fa2b8}
  #modes button.on{color:var(--gold)}
  /* 竖屏:换行 */
  @media (max-aspect-ratio: 4/5){
    #deck{gap:10px;padding-bottom:clamp(20px,4vh,40px)}
    #now{flex:1 1 100%;order:1}
    #bar{flex:1 1 100%;order:2}
    #seven{order:3}
    #modes{order:4;margin-left:auto}
  }

  #info{position:absolute;pointer-events:none;z-index:20;opacity:0;transition:opacity .16s;
    background:rgba(5,9,17,.95);border:1px solid rgba(147,166,187,.16);border-radius:8px;
    padding:10px 13px;max-width:292px;backdrop-filter:blur(8px)}
  #info.show{opacity:1}
  #info .y{font-size:10px;color:var(--gold);letter-spacing:.12em;font-weight:700}
  #info .a{font-size:13px;margin:3px 0 1px;line-height:1.35}
  #info .b{font-size:11px;color:var(--ink2)}
  #info .c{font-size:10.5px;color:var(--ink3);margin-top:7px;padding-top:7px;line-height:1.65;
    border-top:1px solid rgba(147,166,187,.1)}
  #info .c em{font-style:normal;color:#8fd8c4}
  #info .q{font-size:10.5px;color:var(--ink2);margin-top:6px;line-height:1.7;font-style:italic}
  #info .x{color:#e0a97e}
</style>

    <div id="bar"><i></i></div>

    <div id="modes">

    </div>

const DIPORDER=["Ten","Accelerando","The Epic","Waiting Game","Jesup Wagon","Amaryllis","Breaking Stretch"];

/* ── 三套坐标:每项 [x, y, 透视缩放] ───────────────────────────────── */
const FOC=700, LIFT=26;
function pj(x,y,z,cx,cy){const k=FOC/(FOC+z);return [cx+(x-cx)*k, cy+(y-cy)*k-LIFT, k]}
/* ① 星轨:散布,不做深度(保可点性),缩放恒为 1 */
const POS_ORB=[[120,280],[150,120],[200,420],[260,520],[280,230],[300,80],[370,380],
 [440,510],[450,290],[470,140],[530,440],[610,235],[620,520],[640,95],[690,395],
 [790,300],[820,150],[860,450],[900,110],[920,240]].map(p=>[500+(p[0]-500)*.86, 268+(p[1]-268)*.80-LIFT, 1]);
/* ② 北斗:斗柄缩进深处,斗魁的口朝向观察者张开 */
const DIP3D={"Ten":[196,150,330],"Accelerando":[320,224,240],"The Epic":[444,272,150],
 "Waiting Game":[566,318,60],"Jesup Wagon":[590,452,10],"Amaryllis":[792,452,-40],
 "Breaking Stretch":[768,306,-30]};
const RESTPOS=[[110,180],[170,330],[130,470],[250,250],[300,420],[240,530],[400,120],
 [430,400],[520,470],[600,120],[640,430],[880,180],[900,430]];
/* ③ 天鹅座:真实星表 2D 布局,绕竖直轴转 40° 做四分之三侧向 */
const CYG_SK=["Albireo","η","Sadr","Deneb","Gienah","ζ","δ","ι"];
const POS_CYG=[[412,61],[486,235],[525,389],[577,515],[355,402],[225,454],[699,311],[854,338],
 [383,173],[509,138],[462,325],[572,296],[433,398],[275,402],[625,353],[775,320],
 [614,440],[496,483],[614,259],[413,460]];
const CYG_ED=[[0,1],[1,2],[2,3],[5,4],[4,2],[2,6],[6,7]];
function cyg34(deg=40,tilt=10,k=0.96){
  const th=deg*Math.PI/180, tx=tilt*Math.PI/180;
  return POS_CYG.map(([x,y])=>{
    const dx=(x-500)*k, dy=(y-262)*k;
    const X=dx*Math.cos(th), Z=-dx*Math.sin(th)+dy*Math.sin(tx), Y=dy*Math.cos(tx);
    return pj(500+X,268+Y,Z,500,268);
  });
}

/* 收缩:让星座只占画面约六成,四周留大片空天 */
const FIT=(p,k=0.72,cx=500,cy=258)=>[cx+(p[0]-cx)*k, cy+(p[1]-cy)*k];
const NS="http://www.w3.org/2000/svg";
const E=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
const $=i=>document.getElementById(i);
const F=n=>S.find(s=>s.al===n);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

/* 四芒星 */
function spike(x,y,r){
  x=+x;y=+y;r=+r;
  return `M${x} ${y-r*3.2}Q${x+r*.22} ${y-r*.5} ${x+r*3.2} ${y}`
   +`Q${x+r*.22} ${y+r*.5} ${x} ${y+r*3.2}`
   +`Q${x-r*.22} ${y+r*.5} ${x-r*3.2} ${y}`
   +`Q${x-r*.22} ${y-r*.5} ${x} ${y-r*3.2}Z`}

/* ── 远景星场:随 viewBox 面积重建 ── */
function buildFar(){
  const g=$("farstars"); g.innerHTML="";
  let sd=20260802; const rn=()=>{sd=(sd*1103515245+12345)&0x7fffffff;return sd/0x7fffffff};
  const n=Math.round(VB.w*VB.h/620);                 /* 密度恒定,不随屏幕变稀 */
  for(let i=0;i<n;i++){
    const x=VB.x+rn()*VB.w, y=VB.y+rn()*VB.h, m=rn();
    if(m>.9945){const r=1.8;
      g.appendChild(E("circle",{cx:x.toFixed(1),cy:y.toFixed(1),r:(r*4).toFixed(1),fill:"url(#h)"}));
      g.appendChild(E("path",{d:spike(x,y,r),fill:"#fff","fill-opacity":".9"}));}
    else if(m>.972)g.appendChild(E("circle",{cx:x.toFixed(1),cy:y.toFixed(1),
      r:(.8+rn()*.45).toFixed(2),fill:"#fff","fill-opacity":(.5+rn()*.42).toFixed(2)}));
    else g.appendChild(E("circle",{cx:x.toFixed(1),cy:y.toFixed(1),
      r:(.25+rn()*.38).toFixed(2),fill:"#dbe9fb","fill-opacity":(.07+rn()*.30).toFixed(2)}));
  }
}
/* ── 响应式 viewBox:横屏固定高、竖屏固定宽;星座尺寸不变,天空延伸 ── */
const ANCHOR={x:500,y:268};
let VB={x:0,y:-12,w:1000,h:560};
function layout(){
  const r=$("skywrap").getBoundingClientRect();
  const asp=Math.max(.35,r.width/Math.max(1,r.height));
  let w,h;
  if(asp>=1){h=640; w=640*asp;} else {w=880; h=880/asp;}
  VB={x:ANCHOR.x-w/2, y:ANCHOR.y-h*0.46, w, h};
  $("sky").setAttribute("viewBox",`${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
  [["bgrect"],["vgrect"]].forEach(([id])=>{const e=$(id);
    e.setAttribute("x",VB.x.toFixed(1));e.setAttribute("y",VB.y.toFixed(1));
    e.setAttribute("width",w.toFixed(1));e.setAttribute("height",h.toFixed(1));});
  const mw=$("mwrect"), L=Math.hypot(w,h)*1.25;
  mw.setAttribute("x",(ANCHOR.x-L/2).toFixed(1));
  mw.setAttribute("y",(ANCHOR.y-L*0.16).toFixed(1));
  mw.setAttribute("width",L.toFixed(1));
  mw.setAttribute("height",(L*0.32).toFixed(1));
  mw.setAttribute("transform",`rotate(-20 ${ANCHOR.x} ${ANCHOR.y})`);
  buildFar();
}
addEventListener("resize",layout);

/* ── 位置分配 ── 骨架 8 = 你挑的七首 + Emanon(唯一格莱美) */

                "Waiting Game","Jesup Wagon","Amaryllis","Breaking Stretch"];
const CYGP=cyg34(40);
const restC=S.filter(d=>!CYG_MAIN.includes(d.al));
CYG_MAIN.forEach((n,i)=>{const d=F(n);d._cyg=CYGP[i];d._cygName=CYG_SK[i]});
restC.forEach((d,i)=>{d._cyg=CYGP[8+i]});
S.forEach((d,i)=>{d._orb=POS_ORB[i]});
let ri=0;
S.forEach(d=>{
  if(d.dip){const[a,b,c]=DIP3D[d.al];d._dip=pj(a,b,c,500,290)}
  else{const p=RESTPOS[ri++];d._dip=[500+(p[0]-500)*.88, 290+(p[1]-290)*.84-LIFT, .55]}
});
const VIEWS=[d=>d._orb,d=>d._dip,d=>d._cyg];

/* ── 建星 ── */
const R=d=>({3:5.6,2:4.2,1:3.2})[d.lit];
S.forEach((d,i)=>{
  d.p=[d._orb[0],d._orb[1]]; d.sc=d._orb[2]; d._r=R(d)*0.55; d._heard=false;
  d._h=E("circle",{cx:0,cy:0,r:d._r*4.2,fill:"url(#h)"});
  d._s=E("path",{d:"",fill:"#fff","fill-opacity":".38"});
  d._ring=E("circle",{cx:0,cy:0,r:d._r*4.6,fill:"none",stroke:"#ffd08a",
    "stroke-width":1,"stroke-opacity":0});
  $("g-star").appendChild(d._h);$("g-star").appendChild(d._s);$("g-star").appendChild(d._ring);
  d._l=E("text",{class:"lab"});d._l.textContent=d.pv;$("g-lab").appendChild(d._l);
  d._t=E("circle",{class:"hit",r:18});
  d._t.onmouseenter=e=>show(d,e);d._t.onmousemove=mv;d._t.onmouseleave=hide;
  d._t.onclick=()=>play(d);
  $("g-hit").appendChild(d._t);
});
/* 独立轨道:每颗自己的中心/倾角/扁率,彼此不套嵌 */
S.forEach((d,i)=>{
  const a=1.1+i*2.399, L=170+((i*137)%210), k=.30+((i*53)%28)/100;
  d._oc=[d._orb[0]-Math.cos(a)*L, d._orb[1]-Math.sin(a)*L*k];
  d._oa=L; d._ok=k; d._oth=a*180/Math.PI; d._ophi=a;
});

/* ── 七个点 ── */
DIPORDER.forEach(()=>$("seven").appendChild(document.createElement("i")));
function sevenUp(){
  const n=DIPORDER.filter(a=>F(a)._heard).length;
  [...$("seven").children].forEach((e,i)=>e.classList.toggle("on",i<n));
}
$("seven").onmouseenter=()=>DIPORDER.forEach(a=>F(a)._ring.setAttribute("stroke-opacity",.6));
$("seven").onmouseleave=()=>DIPORDER.forEach(a=>{const d=F(a);
  d._ring.setAttribute("stroke-opacity",d._heard?.5:0)});

/* ── 连线定义(按视图) ── */
const DRUM={};S.forEach(d=>d.dr.forEach(([n])=>{(DRUM[n]=DRUM[n]||[]).push(d.al)}));
const KIN=[];Object.entries(DRUM).forEach(([n,as])=>{
  if(as.length>1)for(let i=1;i<as.length;i++)KIN.push([as[i-1],as[i],n])});
const KINCOL={"Brian Blade":"#8fc4e5","Marcus Gilmore":"#8fd8c4"};
function edgesFor(m){
  if(m===1){const e=[];for(let i=1;i<DIPORDER.length;i++)e.push({a:DIPORDER[i-1],b:DIPORDER[i],gold:1});return e}
  if(m===2){return CYG_ED.map(([i,j])=>({a:CYG_MAIN[i],b:CYG_MAIN[j]}))}
  return []}

/* ── 视图切换:断 → 移(视差)→ 连 ── */
let view=-1, anim=null, farRot=0, farTarget=0, curEdges=[];
const FARROT=[0,4.2,-4.2];
function setView(m){
  if(m===view)return;
  const from=S.map(d=>[d.p[0],d.p[1],d.sc]), to=S.map(d=>VIEWS[m](d));
  const r0=farRot; farTarget=FARROT[m]; view=m;
  document.querySelectorAll("#modes button").forEach(b=>b.classList.toggle("on",+b.dataset.m===m));
  curEdges=edgesFor(m);
  anim={t0:performance.now(),from,to,r0,drawn:false};
  $("g-lnk").innerHTML="";$("g-orb").innerHTML="";
}
const T_BREAK=300,T_MOVE=1200,T_LINK=500,T_ALL=T_BREAK+T_MOVE+T_LINK;

function paintLinks(prog){
  const g=$("g-lnk");
  if(!curEdges.length){if(g.childNodes.length)g.innerHTML="";return}
  if(g.childNodes.length!==curEdges.length){
    g.innerHTML="";
    curEdges.forEach(e=>{const p=E("path",{class:"lnk"+(e.gold?" gold":"")+(e.kin?" kin":"")});
      if(e.col)p.style.stroke=e.col;g.appendChild(p);e._el=p});
  }
  curEdges.forEach((e,i)=>{
    const A=F(e.a).p,B=F(e.b).p;
    if(e.kin){                                   /* 鼓手:向外拱的弧,淡入 */
      const mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2,dx=B[0]-A[0],dy=B[1]-A[1];
      const L=Math.hypot(dx,dy)||1; let nx=-dy/L,ny=dx/L;
      if((mx-500)*nx+(my-290)*ny<0){nx=-nx;ny=-ny}
      const bw=L*.30,cx=mx+nx*bw,cy=my+ny*bw;
      e._el.setAttribute("d",`M${A[0].toFixed(1)} ${A[1].toFixed(1)}Q${cx.toFixed(1)} ${cy.toFixed(1)} ${B[0].toFixed(1)} ${B[1].toFixed(1)}`);
      e._el.style.strokeOpacity=(prog*.5).toFixed(2);
      return;
    }
    const k=Math.max(0,Math.min(1,(prog-i*.045)/(1-Math.min(.5,curEdges.length*.045))));
    e._el.setAttribute("d",`M${A[0].toFixed(1)} ${A[1].toFixed(1)}L${lerp(A[0],B[0],k).toFixed(1)} ${lerp(A[1],B[1],k).toFixed(1)}`);
    if(e.gold){const on=F(e.a)._heard&&F(e.b)._heard;
      e._el.setAttribute("stroke-opacity",on?.9:.14)}
  });
}
const OC=[505,318],TH=-16*Math.PI/180,KK=.40,ctv=Math.cos(TH),stv=Math.sin(TH);
function ringOf(p){const dx=p[0]-OC[0],dy=p[1]-OC[1];
  const u=dx*ctv+dy*stv,v=(-dx*stv+dy*ctv)/KK;return{a:Math.hypot(u,v),phi:Math.atan2(v,u)}}
function ptOn(a,phi){const lx=a*Math.cos(phi),ly=a*KK*Math.sin(phi);
  return[OC[0]+lx*ctv-ly*stv, OC[1]+lx*stv+ly*ctv]}
function paintOrbits(){
  const g=$("g-orb");
  if(view!==0){if(g.childNodes.length)g.innerHTML="";return}
  if(g.childNodes.length===S.length*2)return;
  g.innerHTML="";
  const dg=(TH*180/Math.PI).toFixed(2);
  S.forEach(d=>{
    const{a,phi}=ringOf(d._orb);
    g.appendChild(E("ellipse",{class:"orb",cx:OC[0],cy:OC[1],
      rx:a.toFixed(1),ry:(a*KK).toFixed(1),
      transform:`rotate(${dg} ${OC[0]} ${OC[1]})`}));
    const sw=(2026-d.pv)*2.7*Math.PI/180, q=ptOn(a,phi-sw);
    g.appendChild(E("path",{class:"trl",
      d:`M${q[0].toFixed(1)} ${q[1].toFixed(1)} A${a.toFixed(1)} ${(a*KK).toFixed(1)} ${dg} 0 1 ${d._orb[0]} ${d._orb[1]}`}));
  });
}

/* ── 声音 + 脉动 ── */
const au=$("au");let AC,AN,BUF,able=false,cur=null,tried=false;
au.ontimeupdate=()=>{if(!cur)return;
  document.querySelector("#bar i").style.width=((au.currentTime/(au.duration||30))*100)+"%";
  if(!cur._heard&&au.currentTime>4){cur._heard=true;sevenUp();
    if(cur.dip)cur._ring.setAttribute("stroke-opacity",.5)}};
au.onended=()=>{document.querySelector("#bar i").style.width="0%";
  $("now").classList.remove("on");cur=null};
function initAN(){if(AC)return;try{
  AC=new(window.AudioContext||window.webkitAudioContext)();
  const s=AC.createMediaElementSource(au);AN=AC.createAnalyser();
  AN.fftSize=256;AN.smoothingTimeConstant=.55;s.connect(AN);AN.connect(AC.destination);
  BUF=new Uint8Array(AN.frequencyBinCount);able=true}catch(e){able=false}}
function play(d){
  if(!d.u)return;cur=d;$("now").classList.add("on");
  document.querySelector("#now .t").textContent=d.tr+" — "+d.ar;
  document.querySelector("#now .s").textContent=d.pv+" 届";
  if(!tried){tried=true;au.crossOrigin="anonymous"}
  au.src=d.u;
  au.play().then(()=>{initAN();if(AC&&AC.state==="suspended")AC.resume()})
   .catch(()=>{au.removeAttribute("crossorigin");able=false;au.src=d.u;au.play().catch(()=>{})})}

/* ── 信息卡 ── */
function show(d,e){
  const dr=d.dr.map(([n,b,dd,t])=>{const life=b?` ${b}${dd?"–"+dd:""}`:"";
    const also=(DRUM[n]||[]).filter(v=>v!==d.al);
    return n+life+(t?" · "+t:"")+(also.length?` <em>· ${also.join(" / ")}</em>`:"")}).join("<br>");
  $("info").innerHTML=`<div class="y">${d.pv} 届${d.dip?" · "+d.dip:""}${d._cygName&&view===2?" · "+d._cygName:""}</div>
   <div class="a">${d.al}</div><div class="b">${d.ar} <span style="color:#33404f">· 发行 ${d.y}</span></div>
   <div class="c">${dr}${d.note?"<br>"+d.note:""}${d.u?"":'<br><span class="x">✕ '+d.x+'</span>'}</div>
   ${d.q?'<div class="q">'+d.q+'</div>':""}`;
  $("info").classList.add("show");
  const mine=new Set(d.dr.map(v=>v[0]));
  S.forEach(o=>{if(o!==d&&o.dr.some(v=>mine.has(v[0])))o._s.setAttribute("fill-opacity",1)});
  /* 同一位鼓手:悬停才画弧 */
  const g=$("g-kin");g.innerHTML="";
  KIN.filter(([a,b])=>a===d.al||b===d.al||mine.has(0)).forEach(([a,b,n])=>{
    if(!mine.has(n))return;
    const A=F(a).p,B=F(b).p,mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2;
    const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1;
    let nx=-dy/L,ny=dx/L; if((mx-500)*nx+(my-258)*ny<0){nx=-nx;ny=-ny}
    const bw=L*.28,p=E("path",{class:"lnk kin",
      d:`M${A[0].toFixed(1)} ${A[1].toFixed(1)}Q${(mx+nx*bw).toFixed(1)} ${(my+ny*bw).toFixed(1)} ${B[0].toFixed(1)} ${B[1].toFixed(1)}`});
    p.style.stroke=KINCOL[n]||"#8fd8c4"; g.appendChild(p)});
  mv(e)}
function mv(e){const i=$("info"),w=$("skywrap").getBoundingClientRect();
 let x=e.clientX-w.left+16,y=e.clientY-w.top+14;
 if(x+300>w.width)x=e.clientX-w.left-306;if(y+156>w.height)y=e.clientY-w.top-162;
 i.style.left=x+"px";i.style.top=y+"px"}
function hide(){$("info").classList.remove("show");$("g-kin").innerHTML="";
 S.forEach(o=>o._s.setAttribute("fill-opacity",o._heard?1:.38))}

/* ── 主循环 ── */
const T0=performance.now();
(function loop(){
  requestAnimationFrame(loop);
  /* 转场 */
  if(anim){
    const el=performance.now()-anim.t0;
    if(el<T_BREAK){                                  /* 断 */
      const k=1-el/T_BREAK; $("g-lnk").style.opacity=k;
      $("g-orb").style.opacity=k;$("g-trl").style.opacity=k;
    }else if(el<T_BREAK+T_MOVE){                     /* 移:视差 */
      const t=ease((el-T_BREAK)/T_MOVE);
      S.forEach((d,i)=>{d.p[0]=lerp(anim.from[i][0],anim.to[i][0],t);
                        d.p[1]=lerp(anim.from[i][1],anim.to[i][1],t);
                        d.sc =lerp(anim.from[i][2],anim.to[i][2],t)});
      farRot=lerp(anim.r0,farTarget,t);              /* 远景只转一点点 */
      $("g-lnk").style.opacity=0;
    }else{                                           /* 连 */
      const t=Math.min(1,(el-T_BREAK-T_MOVE)/T_LINK);
      S.forEach((d,i)=>{d.p[0]=anim.to[i][0];d.p[1]=anim.to[i][1];d.sc=anim.to[i][2]});
      farRot=farTarget;
      $("g-lnk").style.opacity=1;$("g-orb").style.opacity=1;$("g-trl").style.opacity=1;
      paintOrbits(); paintLinks(t);
      if(el>T_ALL)anim=null;
    }
  }else if(view>=0){ paintOrbits(); paintLinks(1) }
  $("far").setAttribute("transform",`rotate(${farRot.toFixed(2)} 480 300)`);

  /* 脉动 */
  let e=0;
  if(cur&&!au.paused){
    if(able&&AN){AN.getByteFrequencyData(BUF);let s=0;for(let i=0;i<8;i++)s+=BUF[i];
      e=Math.min(1,Math.max(0,(s/8-96)/110))}
    else e=(.5+.5*Math.sin((performance.now()-T0)/1000*Math.PI*2*112/60))*.55}

  S.forEach(d=>{
    const[x,y]=d.p, big=(d===cur)?1+e*.85:1, r=d._r*big*d.sc;
    d._s.setAttribute("d",spike(x.toFixed(1),y.toFixed(1),r));
    d._h.setAttribute("cx",x.toFixed(1));d._h.setAttribute("cy",y.toFixed(1));
    d._h.setAttribute("r",(r*4.2).toFixed(1));
    d._h.setAttribute("fill",(d.dip&&view===1)?"url(#hg)":"url(#h)");
    d._ring.setAttribute("cx",x.toFixed(1));d._ring.setAttribute("cy",y.toFixed(1));d._ring.setAttribute("r",(r*4.6).toFixed(1));
    d._t.setAttribute("cx",x.toFixed(1));d._t.setAttribute("cy",y.toFixed(1));
    const lft=x>720;
    d._l.setAttribute("x",(lft?x-r*3.6-6:x+r*3.6+6).toFixed(1));
    d._l.setAttribute("y",(y+3.5).toFixed(1));
    d._l.setAttribute("text-anchor",lft?"end":"start");
    d._l.setAttribute("opacity",view===1&&!d.dip?.28:1);
    if(!cur||d!==cur)d._s.setAttribute("fill-opacity",Math.min(1,(d._heard?1:.42)*(0.55+0.55*d.sc)));
  });
})();

layout();
$("gate").onclick=()=>{play(F(OPEN));$("gate").classList.add("off");
  setTimeout(()=>{$("app").classList.add("on");setView(0)},450)};
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>setView(+b.dataset.m));
onkeydown=e=>{if(e.key==="ArrowRight")setView(Math.min(2,view+1));
 if(e.key==="ArrowLeft")setView(Math.max(0,view-1))};
</script>
</body>
</html>
