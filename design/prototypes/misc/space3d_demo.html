<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爵士星空 · 真 3D 空间 demo(环绕 + 飞入拜访分类)</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; overflow:hidden; background:#0d0f14; font-family:Georgia,"Songti SC",serif; color:#E8E0CF; }
  #scene { position:fixed; inset:0; z-index:0; }
  #labels { position:fixed; inset:0; z-index:1; pointer-events:none; }
  .lab { position:absolute; transform:translate(-50%,-140%); white-space:nowrap; text-align:center;
    font-size:12px; color:#EDE4D2; text-shadow:0 1px 6px #000; transition:opacity .2s; }
  .lab .yr { font-size:9px; color:#a89f8c; }
  #ui { position:fixed; left:24px; top:22px; z-index:2; }
  #ui h1 { font-size:15px; font-weight:400; color:#CDBFA6; letter-spacing:.04em; }
  #ui p { font-size:11px; color:#8A8474; margin-top:4px; max-width:320px; line-height:1.6; }
  #visit { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:2; display:flex; gap:10px; }
  #visit button { font-family:inherit; font-size:12px; color:#E8E0CF; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.18); border-radius:20px; padding:7px 16px; cursor:pointer; transition:.2s; }
  #visit button:hover { background:rgba(224,122,69,.22); border-color:#E07A45; }
  #visit .reset { color:#a89f8c; }
</style>
</head>
<body>
  <div id="scene"></div>
  <div id="labels"></div>
  <div id="ui">
    <h1>爵士星空 · 真 3D 空间</h1>
    <p>拖拽 = 在空间里环绕 · 滚轮 = 推近拉远 · 点下面的分类 = 相机飞过去"拜访"那一簇星。</p>
  </div>
  <div id="visit">
    <button data-z="1">拜访 · 电声座</button>
    <button data-z="2">拜访 · 电子座</button>
    <button data-z="0">拜访 · 原声座</button>
    <button class="reset" data-z="-1">回到全景</button>
  </div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
const DATA = [
  { tag:"FUSION", c:"#F0A24A", size:"XL", yr:1976, zone:1 },
  { tag:"JAPAN", c:"#E4735E", size:"L", yr:1976, zone:1 },
  { tag:"UK WAVE", c:"#3FB3A4", size:"L", yr:2016, zone:1 },
  { tag:"ACID JAZZ", c:"#EEBE52", size:"S", yr:1987, zone:1 },
  { tag:"HIP-HOP", c:"#95BE8E", size:"XL", yr:1991, zone:2 },
  { tag:"NU JAZZ", c:"#9d8fd4", size:"M", yr:1998, zone:2 },
  { tag:"ECM", c:"#82A6B2", size:"M", yr:1975, zone:0 },
  { tag:"LATIN", c:"#CE384F", size:"L", yr:1973, zone:0 },
  { tag:"JAM", c:"#4A82C4", size:"M", yr:1991, zone:0 },
  { tag:"NEW STD", c:"#9C7EC0", size:"L", yr:2008, zone:0 },
  { tag:"SPIRITUAL", c:"#E4B24A", size:"L", yr:2015, zone:0 },
];
const RSTAR = { XL:5.5, L:4, M:3, S:2.3 };
const idxByTag={}; DATA.forEach((d,i)=>idxByTag[d.tag]=i);
const CONST = { 1:[["FUSION","JAPAN"],["JAPAN","UK WAVE"],["UK WAVE","ACID JAZZ"],["ACID JAZZ","FUSION"]],
  2:[["HIP-HOP","NU JAZZ"]],
  0:[["ECM","LATIN"],["LATIN","JAM"],["JAM","NEW STD"],["NEW STD","SPIRITUAL"]] };
const TIES = [["FUSION","HIP-HOP"],["ACID JAZZ","HIP-HOP"],["JAPAN","HIP-HOP"],["SPIRITUAL","HIP-HOP"],["SPIRITUAL","UK WAVE"],["ACID JAZZ","UK WAVE"],["ECM","NU JAZZ"]];
/* 三簇中心(在 3D 空间不同深度)*/
const CLUSTER = { 1:new THREE.Vector3(-70,34,10), 2:new THREE.Vector3(78,14,-46), 0:new THREE.Vector3(4,-40,40) };
/* 每颗星在其簇内的相对偏移(手工,成星座形状)*/
const OFF = {
  FUSION:[-24,6,4], JAPAN:[-2,26,-6], "UK WAVE":[30,4,8], "ACID JAZZ":[6,-20,-4],
  "HIP-HOP":[-14,10,6], "NU JAZZ":[18,-14,-8],
  ECM:[-60,20,-6], LATIN:[-24,-16,10], JAM:[6,8,-8], "NEW STD":[36,-10,6], SPIRITUAL:[64,18,-4],
};
DATA.forEach(d=>{ const o=OFF[d.tag], C=CLUSTER[d.zone]; d.pos=new THREE.Vector3(C.x+o[0],C.y+o[1],C.z+o[2]); });

/* ===== three 场景 ===== */
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x0d0f14,0.0022);
const cam=new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 2000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(2,devicePixelRatio));
document.getElementById("scene").appendChild(renderer.domElement);

/* 暖色深空背景渐变(大球内壁)*/
{ const g=new THREE.SphereGeometry(900,32,32);
  const m=new THREE.ShaderMaterial({ side:THREE.BackSide, uniforms:{}, vertexShader:
    `varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec3 vP; void main(){ float t=clamp((vP.y/900.0)*0.5+0.5,0.0,1.0);
      vec3 top=vec3(0.078,0.086,0.114); vec3 mid=vec3(0.129,0.114,0.090); vec3 bot=vec3(0.196,0.137,0.086);
      vec3 col=mix(bot,mix(mid,top,smoothstep(0.5,1.0,t)),smoothstep(0.0,1.0,t)); gl_FragColor=vec4(col,1.0);}` });
  scene.add(new THREE.Mesh(g,m)); }

/* 星尘粒子云(纵深)*/
function dustTex(){ const c=document.createElement("canvas"); c.width=c.height=64; const x=c.getContext("2d");
  const gr=x.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,"rgba(255,255,255,1)"); gr.addColorStop(.4,"rgba(255,250,240,.6)"); gr.addColorStop(1,"rgba(255,255,255,0)");
  x.fillStyle=gr; x.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); }
const DTEX=dustTex();
{ const N=2600, pos=new Float32Array(N*3), col=new Float32Array(N*3);
  for(let i=0;i<N;i++){ const r=180+Math.random()*520, th=Math.random()*Math.PI*2, ph=Math.acos(Math.random()*2-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th)*0.6; pos[i*3+2]=r*Math.cos(ph);
    const w=Math.random(); col[i*3]=0.95; col[i*3+1]=0.92-w*0.1; col[i*3+2]=0.82-w*0.2; }
  const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.BufferAttribute(pos,3));
  g.setAttribute("color",new THREE.BufferAttribute(col,3));
  const m=new THREE.PointsMaterial({size:2.4,map:DTEX,vertexColors:true,transparent:true,opacity:.9,
    depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});
  scene.add(new THREE.Points(g,m)); }

/* 银河淡带(一层大而稀的暖色点)*/
{ const N=900, pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){ const u=(Math.random()-.5)*1100, v=(Math.random()-.5)*90, w=(Math.random()-.5)*380;
    pos[i*3]=u; pos[i*3+1]=v+ u*0.12; pos[i*3+2]=w; }
  const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.BufferAttribute(pos,3));
  const m=new THREE.PointsMaterial({size:6,map:DTEX,color:0x6a5f52,transparent:true,opacity:.5,depthWrite:false,blending:THREE.AdditiveBlending});
  const mw=new THREE.Points(g,m); mw.rotation.z=-0.32; scene.add(mw); }

/* 光晕纹理(发光星)*/
function glowTex(){ const c=document.createElement("canvas"); c.width=c.height=128; const x=c.getContext("2d");
  const gr=x.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,"rgba(255,255,255,1)");
  gr.addColorStop(.25,"rgba(255,255,255,.9)"); gr.addColorStop(.5,"rgba(255,255,255,.35)"); gr.addColorStop(1,"rgba(255,255,255,0)");
  x.fillStyle=gr; x.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); }
const GTEX=glowTex();

/* 星座连线 + 血缘线 */
function lineBetween(a,b,color,op,w){ const g=new THREE.BufferGeometry().setFromPoints([DATA[idxByTag[a]].pos,DATA[idxByTag[b]].pos]);
  const m=new THREE.LineBasicMaterial({color,transparent:true,opacity:op}); return new THREE.Line(g,m); }
Object.values(CONST).flat().forEach(([a,b])=>scene.add(lineBetween(a,b,0xbcd0e6,.22)));
const tieLines=TIES.map(([a,b])=>{ const l=lineBetween(a,b,0xE07A45,.5); scene.add(l); return l; });

/* 发光星:光晕 sprite + 亮核 sprite */
DATA.forEach(d=>{ const r=RSTAR[d.size];
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:GTEX,color:new THREE.Color(d.c),transparent:true,opacity:.9,depthWrite:false,blending:THREE.AdditiveBlending}));
  halo.scale.set(r*6,r*6,1); halo.position.copy(d.pos); scene.add(halo);
  const core=new THREE.Sprite(new THREE.SpriteMaterial({map:GTEX,color:0xffffff,transparent:true,opacity:1,depthWrite:false,blending:THREE.AdditiveBlending}));
  core.scale.set(r*2.2,r*2.2,1); core.position.copy(d.pos); scene.add(core);
  d._halo=halo; });

/* 标签 DOM */
const labWrap=document.getElementById("labels");
DATA.forEach(d=>{ const el=document.createElement("div"); el.className="lab";
  el.innerHTML=`${d.tag}<div class="yr">${d.yr}</div>`; labWrap.appendChild(el); d._lab=el; });

/* ===== 轨道相机(自写)===== */
const target=new THREE.Vector3(0,0,0);
let radius=270, theta=0.6, phi=1.25, autorot=true;
const tween={active:false};
function applyCam(){ cam.position.set(
  target.x+radius*Math.sin(phi)*Math.cos(theta),
  target.y+radius*Math.cos(phi),
  target.z+radius*Math.sin(phi)*Math.sin(theta)); cam.lookAt(target); }
/* 拖拽 */
let drag=false,lx=0,ly=0;
renderer.domElement.addEventListener("pointerdown",e=>{drag=true;autorot=false;lx=e.clientX;ly=e.clientY;});
addEventListener("pointerup",()=>drag=false);
addEventListener("pointermove",e=>{ if(!drag)return; theta-=(e.clientX-lx)*0.005; phi=Math.max(.25,Math.min(2.7,phi-(e.clientY-ly)*0.005)); lx=e.clientX;ly=e.clientY; });
renderer.domElement.addEventListener("wheel",e=>{ e.preventDefault(); radius=Math.max(60,Math.min(560,radius+e.deltaY*0.25)); },{passive:false});
/* 飞入拜访 */
function flyTo(z){ autorot=false; let tPos,tRad;
  if(z===-1){ tPos=new THREE.Vector3(0,0,0); tRad=270; } else { tPos=CLUSTER[z].clone(); tRad=95; }
  const t0=performance.now(), sT=target.clone(), sR=radius;
  tween.active=true;
  (function step(now){ const k=Math.min((now-t0)/1100,1), e=1-Math.pow(1-k,3);
    target.lerpVectors(sT,tPos,e); radius=sR+(tRad-sR)*e;
    if(k<1) requestAnimationFrame(step); else tween.active=false; })(t0); }
document.querySelectorAll("#visit button").forEach(b=>b.onclick=()=>flyTo(+b.dataset.z));

/* 标签投影 + 渲染循环 */
const v=new THREE.Vector3();
function updateLabels(){ DATA.forEach(d=>{ v.copy(d.pos).project(cam);
  const vis=v.z<1; const x=(v.x*.5+.5)*innerWidth, y=(-v.y*.5+.5)*innerHeight;
  const dist=cam.position.distanceTo(d.pos);
  d._lab.style.opacity = (vis && dist<220)? Math.max(0,Math.min(1,(220-dist)/120)).toFixed(2) : 0;
  d._lab.style.left=x+"px"; d._lab.style.top=y+"px"; }); }
function loop(){ requestAnimationFrame(loop);
  if(autorot && !drag) theta+=0.0009;
  applyCam(); updateLabels(); renderer.render(scene,cam); }
applyCam(); loop();
addEventListener("resize",()=>{ cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
