<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>校验用甘特图 v1 · 平铺无变形(内容审核版)</title>
<style>
  body { background:#F5F1E6; color:#3A3629; font-family:Georgia,"Songti SC",serif; margin:0; padding:28px 34px; }
  h1 { font-size:17px; font-weight:700; }
  p.sub { font-size:12px; color:#8A8474; margin:4px 0 16px; }
  svg { width:100%; max-width:1240px; display:block; }
  .cap { font-size:12px; color:#6E6B61; max-width:1100px; line-height:1.9; margin-top:14px; }
  .cap b { color:#C25A2E; font-weight:400; }
</style>
</head>
<body>
  <h1>1973 — 2026 · 十一条平行水文 · 校验版甘特图</h1>
  <p class="sub">平铺无透视,只为核对内容:名称 / 起始年 / 分区 / 7 条事件线(实线,按发生年落位) / 2 条演化线(虚线箭头,指向子代源头)。核对无误后再回 v13 谈样式。</p>
  <svg id="g" viewBox="0 0 1240 700"></svg>
  <div class="cap" id="notes"></div>

<script>
const Y0=1972, Y1=2026;
const STREAMS=[
  /* zone0 原声(鸟身) */
  { tag:"LATIN", zone:0, start:1973, lab:"1973", c:"#B21E38", note:"Irakere〈Bacalao con Pan〉" },
  { tag:"ECM", zone:0, start:1975, lab:"1975", c:"#5E8AA0", note:"Köln Concert" },
  { tag:"JAZZ-FUNK", zone:0, start:1991, lab:"1990s", c:"#2F6DB5", note:"Snarky Puppy〈Lingus〉" },
  { tag:"POST-BOP", zone:0, start:2008, lab:"2000s", c:"#7E5FA8", note:"Akinmusire〈Henya〉" },
  { tag:"SPIRITUAL", zone:0, start:2015, lab:"2015", c:"#C8952E", note:"Kamasi《The Epic》" },
  /* zone1 电声(翼) */
  { tag:"FUSION", zone:1, start:1976, lab:"1976", c:"#D8842E", note:"Weather Report〈Birdland〉" },
  { tag:"JAPAN", zone:1, start:1976, lab:"1976*", c:"#C05540", note:"Casiopea〈Asayake〉" },
  { tag:"ACID JAZZ", zone:1, start:1987, lab:"1987", c:"#C9A02E", note:"Brand New Heavies〈Never Stop〉" },
  { tag:"UK JAZZ", zone:1, start:2016, lab:"2010s", c:"#2E8C80", note:"Ezra Collective〈Victory Dance〉" },
  /* zone2 电子(尾羽) */
  { tag:"JAZZ RAP", zone:2, start:1991, lab:"1991", c:"#5F8A53", note:"ATCQ《Low End Theory》" },
  { tag:"NU JAZZ", zone:2, start:1991, lab:"1990s", c:"#7A6BB5", note:"St Germain〈Rose Rouge〉" },
];
const EVENTS=[
  { a:"FUSION", b:"JAZZ RAP", year:1983, num:1, cap:"Herbie Hancock〈Rockit〉——注:早于 JAZZ RAP 成流(1991),文案定位是“提前十年预告”" },
  { a:"ACID JAZZ", b:"JAZZ RAP", year:1993, num:2, cap:"Us3〈Cantaloop〉" },
  { a:"ECM", b:"NU JAZZ", year:1997, num:3, cap:"Nils Petter Molvær《Khmer》(ECM)" },
  { a:"JAPAN", b:"JAZZ RAP", year:2005, num:4, cap:"Nujabes《Modal Soul》· 东京" },
  { a:"JAZZ RAP", b:"SPIRITUAL", year:2015, num:5, cap:"洛杉矶 Brainfeeder:TPAB × The Epic" },
  { a:"ACID JAZZ", b:"UK JAZZ", year:2018, num:6, cap:"Gilles Peterson《We Out Here》" },
  { a:"SPIRITUAL", b:"UK JAZZ", year:2024, num:7, cap:"Shabaka Hutchings 放萨克斯拿笛子" },
];
const LINEAGE=[
  { from:"ACID JAZZ", to:"NU JAZZ", cap:"近亲:舞池基因往电子更深处(Wikipedia)" },
  { from:"JAPAN", to:"NU JAZZ", cap:"Kyoto Jazz Massive → 德国 Compost" },
];
const ZONES=["原声 · 活人(鸟身)","电声 · 插电乐队(翼)","电子 · 采样/编程(尾羽)"];

const SVGNS="http://www.w3.org/2000/svg";
const el=(n,a,txt)=>{ const e=document.createElementNS(SVGNS,n); for(const k in a)e.setAttribute(k,a[k]); if(txt!=null)e.textContent=txt; return e; };
const g=document.getElementById("g");
const VW=1240, padL=190, padR=40, padT=46, rowH=42, zoneGap=34;
const xOf=y=>padL+(y-Y0)/(Y1-Y0)*(VW-padL-padR);
const rowY={}; let yc=padT+18;
[0,1,2].forEach(z=>{
  g.appendChild(el("text",{x:20,y:yc+2,fill:"#8A8474","font-size":"12","letter-spacing":"2"},ZONES[z]));
  yc+=24;
  STREAMS.filter(s=>s.zone===z).forEach(s=>{ rowY[s.tag]=yc; yc+=rowH; });
  yc+=zoneGap;
});
const H=yc;
g.setAttribute("viewBox",`0 0 ${VW} ${H}`);
/* 年代网格 */
for(let yr=1975;yr<=2025;yr+=5){ const x=xOf(yr);
  g.appendChild(el("line",{x1:x,y1:padT-6,x2:x,y2:H-16,stroke:"#D8D2C2","stroke-width":yr%10===5?1:1,"stroke-dasharray":"2 4"}));
  g.appendChild(el("text",{x:x,y:padT-14,fill:"#9a927e","font-size":"11","text-anchor":"middle"},yr)); }
/* 条 */
STREAMS.forEach(s=>{ const y=rowY[s.tag], x0=xOf(s.start), x1=xOf(Y1);
  g.appendChild(el("line",{x1:x0,y1:y,x2:x1,y2:y,stroke:s.c,"stroke-width":5,"stroke-linecap":"round",opacity:.75}));
  g.appendChild(el("circle",{cx:x0,cy:y,r:6,fill:s.c}));
  g.appendChild(el("text",{x:padL-14,y:y+4,fill:"#3A3629","font-size":"13","text-anchor":"end"},s.tag));
  g.appendChild(el("text",{x:x0,y:y-11,fill:"#8A8474","font-size":"10","text-anchor":"middle"},s.lab));
  g.appendChild(el("text",{x:x1-4,y:y-9,fill:"#b8b09c","font-size":"10","text-anchor":"end"},s.note));
});
/* 事件线(实线 + 编号) */
EVENTS.forEach(e_=>{ const x=xOf(e_.year), ya=rowY[e_.a], yb=rowY[e_.b], y1=Math.min(ya,yb), y2=Math.max(ya,yb);
  g.appendChild(el("line",{x1:x,y1:y1,x2:x,y2:y2,stroke:"#C25A2E","stroke-width":1.6,opacity:.85}));
  g.appendChild(el("circle",{cx:x,cy:ya,r:4.5,fill:"#C25A2E"}));
  g.appendChild(el("circle",{cx:x,cy:yb,r:4.5,fill:"#C25A2E"}));
  const cy=(y1+y2)/2;
  g.appendChild(el("circle",{cx:x,cy:cy,r:10,fill:"#F5F1E6",stroke:"#C25A2E","stroke-width":1.4}));
  g.appendChild(el("text",{x:x,y:cy+4,fill:"#C25A2E","font-size":"11","text-anchor":"middle","font-weight":"bold"},e_.num));
});
/* 演化线(虚线曲线箭头:父行 → 子行源头) */
const defs=el("defs",{}); defs.innerHTML='<marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#C25A2E"/></marker>';
g.appendChild(defs);
LINEAGE.forEach(l=>{ const child=STREAMS.find(s=>s.tag===l.to);
  const x2=xOf(child.start), y2v=rowY[l.to], y1v=rowY[l.from];
  const x1=x2-46;
  const path=el("path",{d:`M ${x1} ${y1v} C ${x2-14} ${y1v}, ${x2-30} ${y2v}, ${x2-8} ${y2v}`,
    fill:"none",stroke:"#C25A2E","stroke-width":1.4,"stroke-dasharray":"4 4",opacity:.8,"marker-end":"url(#arr)"});
  g.appendChild(path);
  g.appendChild(el("circle",{cx:x1,cy:y1v,r:3.5,fill:"none",stroke:"#C25A2E","stroke-width":1.4}));
});
/* 说明 */
document.getElementById("notes").innerHTML =
  "<b>事件线(实线·编号)</b>:1 Rockit 1983 · 2 Cantaloop 1993 · 3 Khmer 1997 · 4 Nujabes 2005 · 5 Brainfeeder 2015 · 6 We Out Here 2018 · 7 Shabaka 2024<br>"+
  "<b>演化线(虚线箭头)</b>:ACID JAZZ ⇢ NU JAZZ(近亲,往电子更深处)· JAPAN ⇢ NU JAZZ(Kyoto Jazz Massive → Compost)<br>"+
  "标注说明:JAPAN 起点取 1976*(乐队成立;主流出道 1979)· NU JAZZ 起点按 Wikipedia“Early 1990s”画在 1991,标注 1990s · POST-BOP 画在 2008(《Invisible Cinema》),标注 2000s · UK JAZZ 画在 2016(场景成型期),标注 2010s · ①Rockit 落点早于 JAZZ RAP 成流,属“预告”性质,特此可见。";
</script>
</body>
</html>
